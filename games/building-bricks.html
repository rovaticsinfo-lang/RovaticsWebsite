<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Building Bricks | Rovatics</title>
<style>
/* ============================================================
   Building Bricks - 9999-in-1 LCD handheld, premium finish.
   Everything is sized in `em`; the console sets its own font-size
   from --w so the whole device scales as one rigid object.
   Colours come from the active finish (see THEMES in the script).
   ============================================================ */
:root{
  --w:min(96vw,480px,calc((100vh - 16px)*.53));
  --lcd:#9ead86; --ink:#1a1d14; --ghost:rgba(0,0,0,.08);
  /* finish: Midnight (default) */
  --b1:#22335c; --b2:#0f1938; --b3:#070c1c; --edge:rgba(130,190,255,.25);
  --txt:rgba(225,238,255,.8); --txt2:rgba(225,238,255,.45); --acc:#42e8f5;
  --k1:#2b3860; --k2:#141c36; --k3:#070b17; --chev:#d6e8ff;
  --a1:#7af5ff; --a2:#0878f9; --a3:#04265e; --glow:rgba(66,232,245,.5); --sheen:.10;
}
@supports (height:100dvh){:root{--w:min(96vw,480px,calc((100dvh - 16px)*.53))}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;overflow:hidden;user-select:none;-webkit-user-select:none;
  font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background:radial-gradient(60em 40em at 12% -10%,rgba(8,120,249,.30),transparent 60%),
             radial-gradient(50em 40em at 100% 115%,rgba(66,232,245,.16),transparent 60%),#050a1a}

/* ---------- Body of the device ---------- */
.console{position:relative;width:var(--w);font-size:calc(var(--w)/28);padding:1.25em 1.4em 1.7em;border-radius:2.6em;
  background:linear-gradient(180deg,rgba(255,255,255,var(--sheen)),rgba(255,255,255,0) 22%),
             linear-gradient(155deg,var(--b1) 0%,var(--b2) 50%,var(--b3) 100%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.45),
             0 0 0 1px rgba(0,0,0,.65),0 2.2em 4.5em rgba(0,0,0,.6),0 0 7em rgba(8,120,249,.2)}
.brand{display:flex;justify-content:space-between;align-items:center;margin:.1em .6em .85em;
  color:var(--txt);font-weight:600;letter-spacing:.26em;font-size:.7em;text-transform:uppercase}
.brand .mk{display:flex;align-items:center;gap:1em}
.brand .mk::before{content:"";width:1.1em;height:1.1em;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,var(--acc) 38%,var(--a2));box-shadow:0 0 1em var(--glow)}
.brand b{font-weight:800;color:var(--acc)}
.brand .nine{letter-spacing:.2em;color:var(--txt2)}

/* engraved tetromino icons on the side rails */
.rail{position:absolute;top:4.8em;bottom:3.4em;width:1.3em;display:flex;flex-direction:column;
  justify-content:space-around;align-items:center;pointer-events:none}
.rail.l{left:.05em}.rail.r{right:.05em}
.tet{display:grid;gap:.07em}
.tet i{display:block;width:.28em;height:.28em}
.tet i.b{background:rgba(0,0,0,.4);border-radius:.05em;box-shadow:inset 0 1px 1px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.16)}

/* ---------- Black-glass bezel + LCD ---------- */
.bezel{padding:.8em;border-radius:1.5em;background:linear-gradient(160deg,#0b0f1d,#020409);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 .15em .7em rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.12),0 .7em 1.5em rgba(0,0,0,.45)}
.lcd{position:relative;display:flex;gap:.7em;padding:.8em;border-radius:.8em;background:var(--lcd);
  box-shadow:inset 0 0 1.4em rgba(0,0,0,.6),inset 0 .25em .5em rgba(0,0,0,.45),inset 0 -.1em .3em rgba(0,0,0,.3)}
.lcd::after{content:"";position:absolute;inset:0;border-radius:.8em;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,0) 36%,rgba(0,0,0,.08) 100%)}
.field{flex:0 0 61%;padding:.22em;border:.2em solid var(--ink);border-radius:.15em;opacity:.97}
#grid{display:block;width:100%;aspect-ratio:1/2}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
.lb{font-weight:800;font-size:.68em;line-height:1;letter-spacing:.03em;opacity:.12;margin-bottom:.25em;white-space:nowrap}
.pwr .lb{opacity:.9}
.dgs{display:flex;justify-content:flex-end;gap:.12em;font-size:1.5em}
.two{display:flex;justify-content:space-between;gap:.3em}
.two .dgs{font-size:1.3em}
.nextbox{align-self:flex-end;width:4.2em;padding:.15em;border:.12em solid var(--ink);opacity:.95}
#next{display:block;width:100%;aspect-ratio:1/1}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.icons{display:flex;flex-direction:column;gap:.3em}
.ico{width:1.3em;height:1.3em;color:var(--ink);opacity:.1}
.ico.on{opacity:.92}
.ico .x{display:none}.ico.mute .x{display:inline}.ico.mute .w{display:none}
#mascot{display:block;width:3em;aspect-ratio:5/6}

/* 7-segment digits (unlit = faint ghost segment, lit = ink) */
.dg{position:relative;display:inline-block;width:.64em;height:1.1em;transform:skewX(-6deg)}
.dg i{position:absolute;background:var(--ghost)}
.dg i.on{background:var(--ink)}
.dg .a,.dg .d,.dg .g{left:.09em;width:.46em;height:.12em;clip-path:polygon(0 50%,14% 0,86% 0,100% 50%,86% 100%,14% 100%)}
.dg .a{top:0}.dg .g{top:.49em}.dg .d{top:.98em}
.dg .b,.dg .c,.dg .e,.dg .f{width:.12em;height:.5em;clip-path:polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%)}
.dg .f{left:0;top:.07em}.dg .b{left:.52em;top:.07em}
.dg .e{left:0;top:.55em}.dg .c{left:.52em;top:.55em}

/* ---------- Caption + finish picker ---------- */
.foot{display:flex;justify-content:space-between;align-items:center;margin:.9em .4em 0;gap:.6em}
#caption{color:var(--txt2);font-weight:600;font-size:.6em;letter-spacing:.14em;line-height:1.3}
.dots{display:flex;gap:.5em;flex:none}
.dots button{width:1.05em;height:1.05em;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.4);cursor:pointer;
  box-shadow:inset 0 .1em .15em rgba(255,255,255,.4),0 0 0 .12em rgba(0,0,0,.25)}

/* ---------- System keys ---------- */
.sys{display:flex;justify-content:center;gap:1.3em;margin:1em 0 1.1em}
.sk{display:flex;flex-direction:column;align-items:center;gap:.6em}
.sk span{font-size:.54em;font-weight:600;letter-spacing:.16em;color:var(--txt2)}
.sb{position:relative;width:3.2em;height:1.15em;border:0;border-radius:1em;cursor:pointer;touch-action:none;
  background:linear-gradient(180deg,var(--k1),var(--k2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 0 rgba(0,0,0,.65),0 .35em .6em rgba(0,0,0,.45);
  transition:transform .08s,box-shadow .08s}
.sb.pr{transform:translateY(.1em) scale(.98);box-shadow:inset 0 .1em .3em rgba(0,0,0,.65),0 0 .9em var(--glow)}
.led{position:absolute;right:.5em;top:50%;width:.34em;height:.34em;margin-top:-.17em;border-radius:50%;background:rgba(255,255,255,.2)}
.pwr .led{background:var(--acc);box-shadow:0 0 .7em var(--acc)}

/* ---------- D-pad disc ---------- */
.pads{display:flex;align-items:center;justify-content:space-between;padding:0 .8em}
.dpad{position:relative;width:8.4em;height:8.4em;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,var(--k1),var(--k2) 62%,var(--k3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -.2em .5em rgba(0,0,0,.6),0 .6em 1.3em rgba(0,0,0,.55),0 0 0 .2em rgba(0,0,0,.35)}
.dpad::before{content:"";position:absolute;inset:34%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.1),rgba(0,0,0,.4));
  box-shadow:inset 0 0 .6em rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.14)}
.rb{position:absolute;display:grid;place-items:center;border:0;padding:0;border-radius:50%;background:transparent;cursor:pointer;touch-action:none}
.rb.pr{background:radial-gradient(circle,var(--glow),transparent 68%)}
.d-up{left:30%;top:2%;width:40%;height:32%}.d-down{left:30%;bottom:2%;width:40%;height:32%}
.d-left{top:30%;left:2%;width:32%;height:40%}.d-right{top:30%;right:2%;width:32%;height:40%}
.arr{display:block;width:.62em;height:.62em;border:solid var(--chev);border-width:0 .17em .17em 0;border-radius:.06em;opacity:.8}
.d-up .arr{transform:translateY(.18em) rotate(225deg)}.d-down .arr{transform:translateY(-.18em) rotate(45deg)}
.d-left .arr{transform:translateX(.18em) rotate(135deg)}.d-right .arr{transform:translateX(-.18em) rotate(-45deg)}
.rb.pr .arr{opacity:1}

/* ---------- Action key ---------- */
.act{display:flex;flex-direction:column;align-items:center;gap:.9em}
.ab{width:6.2em;height:6.2em;border:0;border-radius:50%;cursor:pointer;touch-action:none;color:#fff;
  font:700 .62em/1 inherit;letter-spacing:.3em;text-indent:.3em;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:radial-gradient(circle at 32% 26%,var(--a1),var(--a2) 55%,var(--a3));
  box-shadow:0 0 0 .28em rgba(0,0,0,.35),0 0 0 .32em var(--edge),0 .7em 1.3em rgba(0,0,0,.55),0 0 2.4em var(--glow),
             inset 0 .15em .25em rgba(255,255,255,.55),inset 0 -.4em .8em rgba(0,0,0,.3);
  transition:transform .08s,box-shadow .08s}
.ab.pr{transform:scale(.96);box-shadow:0 0 0 .28em rgba(0,0,0,.35),0 0 0 .32em var(--edge),0 .25em .6em rgba(0,0,0,.55),0 0 1.4em var(--glow),
             inset 0 .3em .6em rgba(0,0,0,.35)}
.act span{font-size:.54em;font-weight:600;letter-spacing:.16em;color:var(--txt2)}
</style>
</head>
<body>

<main class="console" id="console" aria-label="Building Bricks handheld game console">
  <div class="rail l" id="railL" aria-hidden="true"></div>
  <div class="rail r" id="railR" aria-hidden="true"></div>

  <div class="brand"><span class="mk">Building <b>Bricks</b></span><span class="nine">9999 in 1</span></div>

  <div class="bezel">
    <div class="lcd">
      <div class="field"><canvas id="grid" width="320" height="640" aria-label="Game screen"></canvas></div>
      <div class="panel">
        <div><div class="lb">HI-SCORE</div><div class="dgs" id="dHi"></div></div>
        <div><div class="lb">SCORE</div><div class="dgs" id="dScore"></div></div>
        <div><div class="lb" style="text-align:right">NEXT</div>
          <div class="nextbox"><canvas id="next" width="96" height="96"></canvas></div></div>
        <div class="two">
          <div><div class="lb">LEVEL</div><div class="dgs" id="dLevel"></div></div>
          <div><div class="lb">SPEED</div><div class="dgs" id="dSpeed"></div></div>
        </div>
        <div class="bottom">
          <div class="icons">
            <svg class="ico" id="icoSnd" viewBox="0 0 24 24" aria-label="Sound"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path class="w" d="M15 8.5a5 5 0 0 1 0 7M17.8 5.8a9 9 0 0 1 0 12.4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="x" d="M15.5 9l6 6M21.5 9l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <svg class="ico" id="icoPause" viewBox="0 0 24 24" aria-label="Paused"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>
            <svg class="ico" id="icoCup" viewBox="0 0 24 24" aria-label="New record"><path d="M7 3h10v6a5 5 0 0 1-10 0V3z" fill="currentColor"/><path d="M7 5H3.5v2a4 4 0 0 0 4 4M17 5h3.5v2a4 4 0 0 1-4 4" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="10.5" y="13.5" width="3" height="4" fill="currentColor"/><rect x="7" y="18" width="10" height="2.5" fill="currentColor"/></svg>
          </div>
          <canvas id="mascot" width="100" height="120" aria-label="Mascot"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="foot"><span id="caption">PRESS ON/OFF</span><span class="dots" id="dots" title="Shell colour"></span></div>

  <div class="sys">
    <div class="sk"><button class="sb" data-sys="power" aria-label="On / Off"><i class="led"></i></button><span>ON/OFF</span></div>
    <div class="sk"><button class="sb" data-sys="start" aria-label="Start / Pause"></button><span>START/PAUSE</span></div>
    <div class="sk"><button class="sb" data-sys="sound" aria-label="Sound"></button><span>SOUND</span></div>
    <div class="sk"><button class="sb" data-sys="reset" aria-label="Reset"></button><span>RESET</span></div>
  </div>

  <div class="pads">
    <div class="dpad">
      <button class="rb d-up" data-act="up" aria-label="Up"><i class="arr"></i></button>
      <button class="rb d-left" data-act="left" aria-label="Left"><i class="arr"></i></button>
      <button class="rb d-right" data-act="right" aria-label="Right"><i class="arr"></i></button>
      <button class="rb d-down" data-act="down" aria-label="Down"><i class="arr"></i></button>
    </div>
    <div class="act">
      <button class="ab" data-act="act" aria-label="Action">ACTION</button>
      <span>ROTATE / FIRE / BOOST</span>
    </div>
  </div>
</main>

<script>
(() => {
'use strict';

/* ============================================================
   0. Small helpers
   ============================================================ */
const W = 10, H = 20;                      // playfield size (cells)
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const px = (buf, x, y) => { if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = 1; };
/** Stamp an ASCII sprite ('X' = lit) into a frame buffer. */
const stamp = (buf, x, y, rows) => rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === 'X') px(buf, x + i, y + j); });

const Store = {
  get(k, d) { try { const v = localStorage.getItem('bb_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bb_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ============================================================
   1. Piezo buzzer audio (Web Audio API, no files)
   ============================================================ */
const N = { C4:262, G4:392, A4:440, B4:494, C5:523, D5:587, E5:659, F5:698, G5:784, A5:880, B5:988, C6:1047, E6:1319, G6:1568 };
const Sound = {
  ctx: null, master: null, enabled: Store.get('snd', true),
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .2; this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  /** One square-wave beep; optional pitch slide `to`. */
  tone(f, d, at = 0, o = {}) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime + at, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.type || 'square'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    g.gain.setValueAtTime(o.vol || 1, t); g.gain.linearRampToValueAtTime(.0001, t + d);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + d + .02);
  },
  seq(notes, step) { notes.forEach((n, i) => n && this.tone(n, step * .92, i * step)); },
  play(n) {
    switch (n) {
      case 'boot':    this.seq([N.C5, N.E5, N.G5, N.C6, 0, N.G5, N.C6], .085); break;
      case 'menu':    this.tone(1000, .03, 0, { vol: .7 }); break;
      case 'move':    this.tone(1300, .02, 0, { vol: .55 }); break;
      case 'rotate':  this.tone(1700, .03); break;
      case 'drop':    this.tone(190, .07, 0, { to: 90 }); break;
      case 'blip':    this.tone(900, .035); break;
      case 'shoot':   this.tone(1900, .07, 0, { to: 520, vol: .7 }); break;
      case 'bounce':  this.tone(700, .04); break;
      case 'brick':   this.tone(1200, .03); this.tone(1650, .04, .035); break;
      case 'line':    this.seq([N.C5, N.E5, N.G5, N.C6], .06); break;
      case 'point':   this.tone(N.E6, .05); this.tone(N.G6, .07, .05); break;
      case 'levelup': this.seq([N.C5, N.C5, N.C5, N.E5, N.G5, 0, N.E5, N.G5, N.C6], .075); break;
      case 'hit':     this.tone(260, .09, 0, { to: 110 }); break;
      case 'explode': for (let i = 0; i < 7; i++) this.tone(320 - i * 38 + rnd(50), .035, i * .03); break;
      case 'crash':   for (let i = 0; i < 12; i++) this.tone(260 - i * 14 + rnd(80), .04, i * .035); break;
      case 'pause':   this.seq([N.G5, N.C5], .07); break;
      case 'over':    this.seq([N.B4, N.A4, 392, 349, 311, 262, 196], .14); break;
    }
  }
};

/* ============================================================
   2. LCD renderer (canvas): 10x20 grid, 4x4 preview, mascot
   ============================================================ */
const INK = '#1a1d14';
function drawCell(ctx, x, y, c, on) {
  const X = x * c, Y = y * c, g = c * .06;
  if (!on) {                                    // faint ghost segment, always visible
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    ctx.fillRect(X + g, Y + g, c - 2 * g, c - 2 * g);
    ctx.fillRect(X + c * .32, Y + c * .32, c * .36, c * .36);
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)';             // soft shadow under the plastic lens
  ctx.fillRect(X + g * 1.9, Y + g * 1.9, c - 2 * g, c - 2 * g);
  ctx.fillStyle = INK; ctx.fillRect(X + g, Y + g, c - 2 * g, c - 2 * g);
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = c * .07;   // inner white border
  ctx.strokeRect(X + c * .22, Y + c * .22, c * .56, c * .56);
  ctx.fillStyle = INK; ctx.fillRect(X + c * .32, Y + c * .32, c * .36, c * .36); // solid centre
}
function drawMatrix(ctx, cols, rows, cell, get) {
  ctx.clearRect(0, 0, cols * cell, rows * cell);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) drawCell(ctx, x, y, cell, get(x, y));
}
const gridCtx = $('#grid').getContext('2d'), nextCtx = $('#next').getContext('2d'), mascotCtx = $('#mascot').getContext('2d');

/* 7-segment readouts */
const SEG = { 0:'abcdef', 1:'bc', 2:'abdeg', 3:'abcdg', 4:'bcfg', 5:'acdfg', 6:'acdefg', 7:'abc', 8:'abcdefg', 9:'abcdfg', '-':'g' };
class SevenSeg {
  constructor(el, n) {
    this.last = null; this.d = [];
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span'); s.className = 'dg'; const m = {};
      for (const k of 'abcdefg') { const e = document.createElement('i'); e.className = k; s.appendChild(e); m[k] = e; }
      el.appendChild(s); this.d.push(m);
    }
  }
  set(v) {
    const n = this.d.length, t = String(v).padStart(n, ' ').slice(-n);
    if (t === this.last) return; this.last = t;
    [...t].forEach((ch, i) => { const on = SEG[ch] || ''; for (const k in this.d[i]) this.d[i][k].classList.toggle('on', on.includes(k)); });
  }
}
const dHi = new SevenSeg($('#dHi'), 6), dScore = new SevenSeg($('#dScore'), 6),
      dLevel = new SevenSeg($('#dLevel'), 2), dSpeed = new SevenSeg($('#dSpeed'), 2);

/* Mascot sprites (5x6) */
const MASCOT = {
  idle:  [['..X..','.XXX.','X.X.X','..X..','.X.X.','.X.X.'], ['..X..','.XXX.','..X..','..X..','.X.X.','X...X']],
  happy: [['X.X.X','.XXX.','..X..','..X..','.X.X.','.X.X.'], ['..X..','X.X.X','.XXX.','..X..','.X.X.','X...X']],
  sad:   [['.....','..X..','.XXX.','.XXX.','.X.X.','.X.X.']]
};

/* ============================================================
   3. Pixel font + menu icons + misc sprites
   ============================================================ */
const F3 = { 0:'111101101101111', 1:'010110010010111', 2:'111001111100111', 3:'111001111001111', 4:'101101111001001',
             5:'111100111001111', 6:'111100111101111', 7:'111001001001001', 8:'111101111101111', 9:'111101111001111' };
const CAR   = ['.X.', 'XXX', '.X.', 'X.X'];
const TSH   = [['.X.','XXX','X.X'], ['XX.','.XX','XX.'], ['X.X','XXX','.X.'], ['.XX','XX.','.XX']]; // up,right,down,left
const SAD   = ['.XXXXXX.','X......X','X.X..X.X','X......X','X..XX..X','X.X..X.X','X......X','.XXXXXX.'];

/* Each icon draws an animated 10x8 teaser (frame f = 0/1) for the menu. */
const ICONS = [
  (b, f) => { stamp(b, 3, f + 1, ['.X.', 'XXX']); for (let x = 0; x < 10; x++) { if (x !== 5) px(b, x, 7); if (x < 4 || x > 6) px(b, x, 6); } px(b, 0, 5); px(b, 1, 5); px(b, 9, 5); },
  (b, f) => { stamp(b, 1, f, ['.XX', 'XX.', '.X.']); px(b, 8, f + 1); for (let x = 0; x < 10; x++) { if (x !== 2) px(b, x, 7); if (x !== 4 && x !== 5) px(b, x, 6); } px(b, 7, 5); px(b, 8, 5); px(b, 9, 5); },
  (b, f) => { for (let x = 0; x < 10; x++) { px(b, x, 0); if (x !== 4) px(b, x, 1); } px(b, f ? 3 : 6, f ? 2 : 4); stamp(b, f ? 4 : 3, 7, ['XXX']); },
  (b, f) => { stamp(b, 6, 0, TSH[2]); stamp(b, 1, 5, TSH[0]); px(b, 2, 4 - f); px(b, 6, 7); px(b, 7, 7); px(b, 8, 7); px(b, 6, 6); px(b, 8, 6); },
  (b, f) => { for (let y = 0; y < 8; y++) if ((y + f * 2) % 4 < 2) px(b, 9, y); stamp(b, 5, f, CAR); stamp(b, 1, 4, CAR); },
  (b, f) => { const P = [[1,5],[1,4],[1,3],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[6,3],[6,4],[6,5],[5,5],[4,5]];
              P.slice(f, 13 + f).forEach(c => px(b, c[0], c[1])); px(b, 8, 6); }
];

/* ============================================================
   4. Games. Interface: constructor(K), update(dt), press(action),
      draw(buf), next(out16) and optional `repeat` / `repMs`.
      K is the console (score, level, speed, sounds, mascot...).
   ============================================================ */

/* ---- 4a. Falling blocks (classic Tetris + pentomino mode) ---- */
const TETS = [
  { s:4, c:[[1,0],[1,1],[1,2],[1,3]] }, { s:2, c:[[0,0],[0,1],[1,0],[1,1]] }, { s:3, c:[[0,1],[1,0],[1,1],[1,2]] },
  { s:3, c:[[0,1],[0,2],[1,0],[1,1]] }, { s:3, c:[[0,0],[0,1],[1,1],[1,2]] }, { s:3, c:[[0,0],[1,0],[1,1],[1,2]] },
  { s:3, c:[[0,2],[1,0],[1,1],[1,2]] }
];
/* 11 pentominoes (the straight I-5 is omitted so every piece fits the 4x4 NEXT window) */
const PENTS = [
  { s:3, c:[[0,1],[0,2],[1,0],[1,1],[2,1]] }, { s:4, c:[[0,0],[1,0],[2,0],[3,0],[3,1]] },
  { s:4, c:[[0,1],[1,1],[2,1],[2,0],[3,0]] }, { s:3, c:[[0,0],[0,1],[1,0],[1,1],[2,0]] },
  { s:3, c:[[0,0],[0,1],[0,2],[1,1],[2,1]] }, { s:3, c:[[0,0],[0,2],[1,0],[1,1],[1,2]] },
  { s:3, c:[[0,0],[1,0],[2,0],[2,1],[2,2]] }, { s:3, c:[[0,0],[1,0],[1,1],[2,1],[2,2]] },
  { s:3, c:[[0,1],[1,0],[1,1],[1,2],[2,1]] }, { s:4, c:[[0,1],[1,0],[1,1],[2,1],[3,1]] },
  { s:3, c:[[0,0],[0,1],[1,1],[2,1],[2,2]] }
];
const BOMB = { s:1, c:[[0,0]], bomb:true };
const LINE_SCORE = [0, 100, 300, 500, 800, 1000];

function previewPiece(p, out) {
  const rs = p.c.map(a => a[0]), cs = p.c.map(a => a[1]);
  const r0 = Math.min(...rs), c0 = Math.min(...cs), h = Math.max(...rs) - r0 + 1, w = Math.max(...cs) - c0 + 1;
  const oy = (4 - h) >> 1, ox = (4 - w) >> 1;
  p.c.forEach(([r, c]) => { const y = r - r0 + oy, x = c - c0 + ox; if (y >= 0 && y < 4 && x >= 0 && x < 4) out[y * 4 + x] = 1; });
}

class Blocks {
  constructor(K, pent) {
    this.K = K; this.pent = pent; this.f = new Uint8Array(W * H);
    this.repeat = ['left', 'right', 'down']; this.repMs = 55;
    this.lines = 0; this.lvl = 0; this.timer = 0; this.clearRows = null; this.clearT = 0; this.bag = [];
    // starting LEVEL = rows of random garbage already on the board
    const g = Math.min(9, Math.round((K.level - 1) * (pent ? .6 : 1)));
    for (let r = H - g; r < H; r++) { const hole = rnd(W); for (let c = 0; c < W; c++) this.f[r * W + c] = (c !== hole && Math.random() < .65) ? 1 : 0; }
    this.nextP = this.make(); this.spawn();
  }
  make() {
    let t;
    if (this.pent) { const r = Math.random(); t = r < .1 ? BOMB : r < .3 ? pick(TETS) : pick(PENTS); }
    else { if (!this.bag.length) this.bag = shuffle(TETS.slice()); t = this.bag.pop(); }
    return { c: t.c.map(a => a.slice()), s: t.s, bomb: !!t.bomb };
  }
  spawn() {
    const p = this.nextP; this.nextP = this.make();
    p.x = (W - p.s) >> 1; p.y = -Math.min(...p.c.map(a => a[0])); this.cur = p; this.timer = 0;
    if (this.hit(p.c, p.x, p.y)) { this.cur = null; this.K.gameOver(); }
  }
  hit(c, x, y) {
    for (const [r, k] of c) { const fr = y + r, fc = x + k;
      if (fc < 0 || fc >= W || fr >= H) return true;
      if (fr >= 0 && this.f[fr * W + fc]) return true; }
    return false;
  }
  update(dt) {
    if (this.clearRows) {                         // line-clear blink, then collapse
      this.clearT += dt;
      if (this.clearT >= 360) {
        const keep = []; for (let r = 0; r < H; r++) if (!this.clearRows.includes(r)) keep.push(this.f.slice(r * W, r * W + W));
        this.f.fill(0); keep.forEach((row, i) => this.f.set(row, (H - keep.length + i) * W));
        this.clearRows = null;
        const lv = Math.floor(this.lines / (this.pent ? 8 : 10));
        while (this.lvl < lv) { this.lvl++; this.K.levelUp(); }
        this.spawn();
      }
      return;
    }
    if (!this.cur) return;
    this.timer += dt;
    const iv = Math.max(70, 720 - (this.K.speed - 1) * 68);
    if (this.timer >= iv) { this.timer -= iv; this.step(false); }
  }
  step(soft) {
    const p = this.cur; if (!p) return;
    if (!this.hit(p.c, p.x, p.y + 1)) { p.y++; if (soft) this.K.addScore(1); } else this.lock();
  }
  lock() {
    const p = this.cur; let over = false, cx = 0, cy = 0;
    for (const [r, k] of p.c) { const fr = p.y + r, fc = p.x + k; if (fr < 0) over = true; else { this.f[fr * W + fc] = 1; cx = fc; cy = fr; } }
    this.cur = null;
    if (over) { this.K.snd('drop'); this.K.gameOver(); return; }
    if (p.bomb) {                                  // single-block bomb: clears a 3x3 area
      let n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const y = cy + dy, x = cx + dx;
        if (x >= 0 && x < W && y >= 0 && y < H && this.f[y * W + x]) { this.f[y * W + x] = 0; n++; }
      }
      this.K.addScore(n * 10); this.K.snd('explode'); this.K.mascotSet('happy', 700);
    } else this.K.snd('drop');
    const rows = []; for (let r = 0; r < H; r++) { let full = true; for (let c = 0; c < W; c++) if (!this.f[r * W + c]) { full = false; break; } if (full) rows.push(r); }
    if (rows.length) {
      this.clearRows = rows; this.clearT = 0; this.lines += rows.length;
      this.K.addScore(LINE_SCORE[Math.min(5, rows.length)]); this.K.snd('line'); this.K.mascotSet('happy', 1200);
    } else this.spawn();
  }
  press(a) {
    const p = this.cur; if (!p || this.clearRows) return;
    if (a === 'left' || a === 'right') { const dx = a === 'left' ? -1 : 1; if (!this.hit(p.c, p.x + dx, p.y)) { p.x += dx; this.K.snd('move'); } }
    else if (a === 'down') this.step(true);
    else if (a === 'up') { let n = 0; while (!this.hit(p.c, p.x, p.y + 1)) { p.y++; n++; } this.K.addScore(n * 2); this.lock(); }   // hard drop
    else if (a === 'act' && !p.bomb) {
      const nc = p.c.map(([r, c]) => [c, p.s - 1 - r]);
      for (const k of [0, -1, 1, -2, 2]) if (!this.hit(nc, p.x + k, p.y)) { p.c = nc; p.x += k; this.K.snd('rotate'); break; }
    }
  }
  draw(buf) {
    for (let r = 0; r < H; r++) {
      if (this.clearRows && this.clearRows.includes(r) && ((this.clearT / 70) | 0) % 2 === 0) continue;
      for (let c = 0; c < W; c++) if (this.f[r * W + c]) buf[r * W + c] = 1;
    }
    if (this.cur) for (const [r, k] of this.cur.c) px(buf, this.cur.x + k, this.cur.y + r);
  }
  next(out) { previewPiece(this.nextP, out); }
}

/* ---- 4b. Brick breaker ---- */
class Breaker {
  constructor(K) {
    this.K = K; this.repeat = ['left', 'right']; this.repMs = 45;
    this.px = 3; this.lives = 3; this.bricks = new Uint8Array(W * H); this.build(); this.reset();
  }
  build() {
    this.bricks.fill(0); const rows = Math.min(9, 3 + (this.K.level >> 1));
    for (let r = 1; r <= rows; r++) for (let x = 0; x < W; x++) if (!(this.K.level > 4 && (x + r) % 7 === 0)) this.bricks[r * W + x] = 1;
  }
  count() { let n = 0; for (let i = 0; i < this.bricks.length; i++) n += this.bricks[i]; return n; }
  reset() { this.launched = false; this.bx = this.px + 1; this.by = H - 2; this.vx = Math.random() < .5 ? -1 : 1; this.vy = -1; this.timer = 0; }
  press(a) {
    if (a === 'left') this.px = Math.max(0, this.px - 1);
    else if (a === 'right') this.px = Math.min(W - 3, this.px + 1);
    else if (a === 'act' && !this.launched) { this.launched = true; this.K.snd('blip'); }
    if (!this.launched) this.bx = this.px + 1;
  }
  update(dt) {
    if (!this.launched) return;
    this.timer += dt; const iv = Math.max(55, 200 - this.K.speed * 14);
    if (this.timer < iv) return; this.timer -= iv;
    let nx = this.bx + this.vx, ny = this.by + this.vy;
    if (nx < 0 || nx >= W) { this.vx = -this.vx; nx = this.bx + this.vx; this.K.snd('bounce'); }
    if (ny < 0) { this.vy = 1; ny = this.by + 1; this.K.snd('bounce'); }
    if (ny >= H) { this.lose(); return; }
    if (this.bricks[ny * W + nx]) {               // brick hit: remove, bounce vertically
      this.bricks[ny * W + nx] = 0; this.vy = -this.vy; this.K.addScore(10 + this.K.level); this.K.snd('brick');
      if (!this.count()) { this.K.addScore(100); this.K.levelUp(); this.build(); this.reset(); }
      return;
    }
    if (ny === H - 1 && nx >= this.px && nx <= this.px + 2) {   // paddle: angle depends on where it lands
      this.vy = -1; if (nx === this.px) this.vx = -1; else if (nx === this.px + 2) this.vx = 1;
      nx = clamp(this.bx + this.vx, 0, W - 1); ny = this.by - 1; this.K.snd('bounce');
    }
    this.bx = nx; this.by = ny;
  }
  lose() {
    this.lives--; this.K.snd('hit');
    if (this.lives <= 0) this.K.gameOver(); else this.reset();
  }
  draw(buf) {
    for (let i = 0; i < buf.length; i++) if (this.bricks[i]) buf[i] = 1;
    for (let i = 0; i < 3; i++) px(buf, this.px + i, H - 1);
    if (this.launched || ((this.K.t / 200) | 0) % 2) px(buf, this.bx, this.by);
  }
  next(out) { for (let i = 0; i < this.lives; i++) out[5 + i] = 1; }   // lives shown in NEXT window
}

/* ---- 4c. Tank battle ---- */
const DIR = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const TIP = [[1, 0], [2, 1], [1, 2], [0, 1]];
class Tank {
  constructor(K) {
    this.K = K; this.repeat = ['left', 'right', 'up', 'down']; this.repMs = 90;
    this.f = new Uint8Array(W * H); this.baseAlive = true; this.lives = 3;
    this.cool = 0; this.spT = 700; this.bT = 0; this.stage();
  }
  stage() {
    this.f.fill(0);
    for (let x = 3; x <= 6; x++) this.f[18 * W + x] = 1; this.f[19 * W + 3] = 1; this.f[19 * W + 6] = 1;   // base walls
    for (let i = 0, n = 4 + this.K.level * 2; i < n; i++) this.f[(3 + rnd(10)) * W + rnd(W)] = 1;          // random cover
    this.todo = 6 + this.K.level; this.bul = []; this.en = []; this.p = { x: 3, y: 15, d: 0 }; this.inv = 1200;
  }
  free(self, x, y) {
    if (x < 0 || y < 0 || x > W - 3 || y > 15) return false;
    for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) if (this.f[(y + dy) * W + x + dx]) return false;
    for (const o of [this.p, ...this.en]) if (o !== self && Math.abs(o.x - x) < 3 && Math.abs(o.y - y) < 3) return false;
    return true;
  }
  press(a) {
    if (a === 'act') { this.fire(this.p, true); return; }
    const d = { up: 0, right: 1, down: 2, left: 3 }[a]; this.p.d = d;
    const nx = this.p.x + DIR[d][0], ny = this.p.y + DIR[d][1];
    if (this.free(this.p, nx, ny)) { this.p.x = nx; this.p.y = ny; this.K.snd('move'); }
  }
  fire(t, own) {
    if (own) { if (this.cool > 0 || this.bul.filter(b => b.own).length >= 2) return; this.cool = 240; }
    const b = { x: t.x + TIP[t.d][0] + DIR[t.d][0], y: t.y + TIP[t.d][1] + DIR[t.d][1], d: t.d, own };
    if (b.x < 0 || b.x >= W || b.y < 0 || b.y >= H) return;
    if (own) this.K.snd('shoot');
    if (!this.resolve(b)) this.bul.push(b);
  }
  inTank(o, x, y) { const r = TSH[o.d][y - o.y]; return r && r[x - o.x] === 'X'; }
  /** Apply a bullet landing on its current cell. Returns true if the bullet is consumed. */
  resolve(b) {
    const i = b.y * W + b.x;
    if (this.f[i]) { this.f[i] = 0; this.K.snd('blip'); return true; }
    if (b.y === H - 1 && (b.x === 4 || b.x === 5)) {
      if (!b.own && this.baseAlive) { this.baseAlive = false; this.K.snd('crash'); this.K.gameOver(); }
      return true;
    }
    if (b.own) {
      for (const e of this.en) if (this.inTank(e, b.x, b.y)) {
        this.en.splice(this.en.indexOf(e), 1); this.K.addScore(100); this.K.snd('explode'); this.K.mascotSet('happy', 700); return true;
      }
    } else if (this.inv <= 0 && this.inTank(this.p, b.x, b.y)) {
      this.lives--; this.K.snd('crash');
      if (this.lives <= 0) this.K.gameOver(); else { this.p = { x: 3, y: 15, d: 0 }; this.inv = 1600; }
      return true;
    }
    return false;
  }
  update(dt) {
    this.cool -= dt; this.inv -= dt;
    if (this.K.held.act) this.fire(this.p, true);
    // bullets advance on a fixed 55 ms tick
    this.bT += dt;
    while (this.bT >= 55 && this.K.state === 'play') {
      this.bT -= 55;
      this.bul = this.bul.filter(b => { b.x += DIR[b.d][0]; b.y += DIR[b.d][1];
        return b.x >= 0 && b.x < W && b.y >= 0 && b.y < H && !this.resolve(b); });
      for (const a of this.bul) for (const b of this.bul) if (a.own && !b.own && a.x === b.x && a.y === b.y) { a.dead = b.dead = true; }
      this.bul = this.bul.filter(b => !b.dead);
    }
    if (this.K.state !== 'play') return;
    // enemies: spawn, wander (biased downward), shoot
    this.spT += dt;
    if (this.todo > 0 && this.en.length < 3 && this.spT > 1200) {
      const x = pick(shuffle([0, 3, 7]).filter(x => this.free(null, x, 0)).concat([-1]));
      if (x >= 0) { this.en.push({ x, y: 0, d: 2, mt: 0, st: 0, sh: 700 + rnd(1200) }); this.todo--; this.spT = 0; }
    }
    const mi = Math.max(130, 460 - this.K.speed * 30);
    for (const e of this.en.slice()) {
      e.mt += dt; e.st += dt;
      if (e.mt >= mi) {
        e.mt = 0; if (Math.random() < .3) e.d = pick([2, 2, 2, 1, 3, 0]);
        const nx = e.x + DIR[e.d][0], ny = e.y + DIR[e.d][1];
        if (this.free(e, nx, ny)) { e.x = nx; e.y = ny; } else e.d = pick([0, 1, 2, 3, 2]);
      }
      if (e.st >= e.sh) { e.st = 0; e.sh = 700 + rnd(1200); this.fire(e, false); }
    }
    if (this.K.state === 'play' && !this.todo && !this.en.length) { this.K.addScore(200); this.K.levelUp(); this.stage(); }
  }
  draw(buf) {
    for (let i = 0; i < buf.length; i++) if (this.f[i]) buf[i] = 1;
    if (this.baseAlive) { px(buf, 4, H - 1); px(buf, 5, H - 1); }
    for (let i = 0; i < this.lives; i++) px(buf, i, H - 1);           // lives, bottom-left corner
    for (const e of this.en) stamp(buf, e.x, e.y, TSH[e.d]);
    if (this.inv <= 0 || ((this.K.t / 100) | 0) % 2) stamp(buf, this.p.x, this.p.y, TSH[this.p.d]);
    for (const b of this.bul) px(buf, b.x, b.y);
  }
  next(out) { const n = Math.min(16, this.todo + this.en.length); for (let i = 0; i < n; i++) out[i] = 1; }   // enemies left
}

/* ---- 4d. Car racing ---- */
const LANES = [0, 3, 6];
class Racer {
  constructor(K) {
    this.K = K; this.lane = 1; this.cars = []; this.rail = 0; this.t = 0; this.crash = 0; this.passed = 0;
    this.planWave(); this.since = this.plan.gap - 4;
  }
  planWave() { const n = (this.K.level >= 3 && Math.random() < .4) ? 2 : 1; this.plan = { lanes: shuffle([0, 1, 2]).slice(0, n), gap: 7 + rnd(4) }; }
  press(a) {
    if (this.crash) return;
    if (a === 'left' && this.lane > 0) { this.lane--; this.K.snd('move'); }
    if (a === 'right' && this.lane < 2) { this.lane++; this.K.snd('move'); }
    this.check();
  }
  check() {
    if (this.crash) return;
    if (this.cars.some(c => c.l === this.lane && c.y + 3 >= 16 && c.y <= 19)) { this.crash = 1; this.K.snd('crash'); this.K.mascotSet('sad', 1e9); }
  }
  update(dt) {
    if (this.crash) { this.crash += dt; if (this.crash > 1100) { this.crash = 0.001; this.K.gameOver(); } return; }
    const boost = !!this.K.held.act, iv = Math.max(45, 250 - this.K.speed * 19) / (boost ? 1.9 : 1);
    this.t += dt;
    while (this.t >= iv && !this.crash) { this.t -= iv; this.step(boost ? 2 : 1); }
  }
  step(mult) {
    this.rail = (this.rail + 1) % 4; this.K.addScore(mult);
    this.cars.forEach(c => c.y++);
    const gone = this.cars.filter(c => c.y >= H); this.cars = this.cars.filter(c => c.y < H);
    if (gone.length) {
      this.passed += gone.length; this.K.addScore(10 * mult * gone.length); this.K.snd('point');
      if (Math.floor(this.passed / 12) > this.lv) { this.lv = Math.floor(this.passed / 12); this.K.levelUp(); }
    }
    if (++this.since >= this.plan.gap) { this.plan.lanes.forEach(l => this.cars.push({ l, y: -4 })); this.planWave(); this.since = 0; }
    this.check();
  }
  draw(buf) {
    for (let y = 0; y < H; y++) if ((y + this.rail) % 4 < 2) px(buf, 9, y);   // scrolling guard rail
    this.cars.forEach(c => stamp(buf, LANES[c.l], c.y, CAR));
    if (!this.crash || ((this.K.t / 90) | 0) % 2) stamp(buf, LANES[this.lane], 16, CAR);
  }
  next(out) { this.plan.lanes.forEach(l => { out[1 * 4 + l] = 1; out[2 * 4 + l] = 1; }); if (this.K.held.act) for (let x = 0; x < 4; x++) out[12 + x] = 1; }
}
Racer.prototype.lv = 0;

/* ---- 4e. Snake (bonus mode 06) ---- */
class Snake {
  constructor(K) {
    this.K = K; this.s = [{ x: 4, y: 12 }, { x: 4, y: 13 }, { x: 4, y: 14 }]; this.d = { x: 0, y: -1 }; this.nd = this.d;
    this.walls = new Uint8Array(W * H); this.eaten = 0; this.timer = 0;
    for (let i = 0, n = (K.level - 1) * 2; i < n; i++) { const x = rnd(W), y = 2 + rnd(11); if (x !== 4) this.walls[y * W + x] = 1; }
    this.placeFood();
  }
  placeFood() { let x, y; do { x = rnd(W); y = rnd(H); } while (this.walls[y * W + x] || this.s.some(c => c.x === x && c.y === y)); this.food = { x, y }; }
  press(a) {
    const d = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[a];
    if (d && !(d.x === -this.d.x && d.y === -this.d.y)) this.nd = d;
  }
  update(dt) {
    this.timer += dt; const iv = Math.max(65, 330 - this.K.speed * 26);
    if (this.timer < iv) return; this.timer -= iv;
    this.d = this.nd; const h = this.s[0], nx = h.x + this.d.x, ny = h.y + this.d.y, eat = nx === this.food.x && ny === this.food.y;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H || this.walls[ny * W + nx] ||
        this.s.some((c, i) => c.x === nx && c.y === ny && (eat || i < this.s.length - 1))) { this.K.gameOver(); return; }
    this.s.unshift({ x: nx, y: ny });
    if (eat) { this.K.addScore(10); this.K.snd('point'); this.K.mascotSet('happy', 500); this.placeFood();
      if (++this.eaten % 5 === 0) this.K.levelUp(); } else this.s.pop();
  }
  draw(buf) {
    for (let i = 0; i < buf.length; i++) if (this.walls[i]) buf[i] = 1;
    this.s.forEach(c => px(buf, c.x, c.y));
    if (((this.K.t / 180) | 0) % 2) px(buf, this.food.x, this.food.y);
  }
  next(out) { [1, 2, 4, 7, 8, 9, 10, 13, 14].forEach(i => out[i] = 1); }   // little apple
}

const MODES = [
  { name: 'CLASSIC BLOCKS', make: K => new Blocks(K, false) },
  { name: 'PENTO + BOMBS',  make: K => new Blocks(K, true) },
  { name: 'BRICK BREAKER',  make: K => new Breaker(K) },
  { name: 'TANK BATTLE',    make: K => new Tank(K) },
  { name: 'CAR RACING',     make: K => new Racer(K) },
  { name: 'SNAKE',          make: K => new Snake(K) }
];

/* ============================================================
   5. The console: power, menu, play, curtain, game over
   ============================================================ */
const hiOf = m => Store.get('hi' + m, 0);
const K = {
  power: false, state: 'off',        // off | boot | menu | play | curtain | over
  cvs: 'menu',                       // what the digits show while a curtain plays
  mode: 1, sel: { speed: 1, level: 1 }, speed: 1, level: 1,
  score: 0, hi: 0, hiStart: 0, newRecord: false, paused: false,
  game: null, curtain: null, t: 0, bootT: 0, overT: 0,
  buf: new Uint8Array(W * H), nxt: new Uint8Array(16), held: {},
  mascot: { s: 'idle', until: 0 },
  snd: n => Sound.play(n),
  mascotSet(s, ms) { K.mascot.s = s; K.mascot.until = K.t + ms; },
  addScore(n) {
    K.score = Math.min(999999, K.score + n);
    if (K.score > K.hi) { K.hi = K.score; Store.set('hi' + K.mode, K.hi); if (K.hiStart > 0) K.newRecord = true; }
  },
  levelUp() { K.level = Math.min(10, K.level + 1); K.speed = Math.min(10, K.speed + 1); Sound.play('levelup'); K.mascotSet('happy', 1500); },
  gameOver() {
    if (K.state !== 'play') return;
    Sound.play('over'); K.mascotSet('sad', 1e9); Store.set('hi' + K.mode, K.hi);
    startCurtain(() => { K.state = 'over'; K.overT = 0; }, 'over');
  }
};

/** Screen curtain: rows fill bottom->top, then clear top->bottom. */
function startCurtain(done, viewState) { K.curtain = { t: 0, done }; K.cvs = viewState; K.state = 'curtain'; }
function updateCurtain(dt) {
  const c = K.curtain; c.t += dt; const idx = Math.floor(c.t / 26), buf = K.buf; buf.fill(0);
  const from = idx <= H ? H - idx : idx - H, to = idx <= H ? H : H;
  for (let y = from; y < to; y++) for (let x = 0; x < W; x++) buf[y * W + x] = 1;
  if (idx >= 2 * H + 2) { K.curtain = null; c.done(); }
}

function toMenu() {
  K.state = 'menu'; K.game = null; K.paused = false; K.score = 0; K.newRecord = false; K.hi = hiOf(K.mode);
  K.mascot.s = 'idle';
}
function startGame() {
  Sound.play('blip');
  K.speed = K.sel.speed; K.level = K.sel.level; K.score = 0; K.hi = hiOf(K.mode); K.hiStart = K.hi; K.newRecord = false; K.paused = false;
  K.mascot.s = 'idle';
  startCurtain(() => { K.game = MODES[K.mode - 1].make(K); K.state = 'play'; }, 'play');
}
function powerToggle() {
  Sound.unlock();
  if (!K.power) { K.power = true; K.state = 'boot'; K.bootT = 0; K.mode = K.mode || 1; K.hi = hiOf(K.mode); Sound.play('boot'); }
  else { if (K.state === 'play') Store.set('hi' + K.mode, K.hi); K.power = false; K.state = 'off'; K.game = null; K.curtain = null; K.paused = false; K.newRecord = false; K.buf.fill(0); }
  document.getElementById('console').classList.toggle('pwr', K.power);
}

/** START/PAUSE, SOUND, RESET, ON/OFF */
function sys(a) {
  Sound.unlock();
  if (a === 'power') return powerToggle();
  if (a === 'sound') { Sound.enabled = !Sound.enabled; Store.set('snd', Sound.enabled); if (Sound.enabled) Sound.play('blip'); return; }
  if (!K.power) return;
  if (a === 'reset') { if (K.state === 'boot') return; Sound.play('boot'); K.game = null; K.paused = false; startCurtain(toMenu, 'menu'); return; }
  if (a === 'start') {
    if (K.state === 'menu') startGame();
    else if (K.state === 'play') { K.paused = !K.paused; Sound.play('pause'); }
    else if (K.state === 'over') { Sound.play('blip'); toMenu(); }
  }
}

/** Directional pad + action (also called by key-repeat) */
function dispatch(a) {
  if (K.state === 'menu') {
    if (a === 'left' || a === 'right') { K.mode = ((K.mode - 1 + (a === 'left' ? -1 : 1) + MODES.length) % MODES.length) + 1; K.hi = hiOf(K.mode); }
    else if (a === 'up' || a === 'down') K.sel.speed = ((K.sel.speed - 1 + (a === 'up' ? 1 : -1) + 10) % 10) + 1;
    else if (a === 'act') K.sel.level = (K.sel.level % 10) + 1;
    Sound.play('menu');
  } else if (K.state === 'play' && !K.paused && K.game) K.game.press(a);
  else if (K.state === 'over' && a === 'act' && K.overT > 900) { Sound.play('blip'); toMenu(); }
}

/* ---------- Input: key repeat (DAS) for held directions ---------- */
const reps = {};
const repOK = a => K.state === 'menu' ? a !== 'act' : (K.state === 'play' && !K.paused && K.game && K.game.repeat && K.game.repeat.includes(a));
const repMs = () => K.state === 'menu' ? 150 : ((K.game && K.game.repMs) || 70);
function press(a) {
  Sound.unlock(); if (K.held[a]) return; K.held[a] = true; dispatch(a);
  clearTimeout(reps[a]);
  reps[a] = setTimeout(function loop() { if (!K.held[a]) return; if (repOK(a)) dispatch(a); reps[a] = setTimeout(loop, repMs()); }, 400);   // long first delay: a normal click/tap must move exactly one cell
}
function release(a) { K.held[a] = false; clearTimeout(reps[a]); }

const keyMap = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', Space:'act' };
const sysMap = { Enter:'start', KeyP:'start', KeyM:'sound', KeyR:'reset', KeyO:'power' };
const padBtn = {}; document.querySelectorAll('[data-act]').forEach(b => padBtn[b.dataset.act] = b);
const sysBtn = {}; document.querySelectorAll('[data-sys]').forEach(b => sysBtn[b.dataset.sys] = b);
const flash = (el, on) => el && el.classList.toggle('pr', on);

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const a = keyMap[e.code], s = sysMap[e.code];
  if (!a && !s) return; e.preventDefault(); if (e.repeat) return;
  if (a) { press(a); flash(padBtn[a], true); } else { sys(s); flash(sysBtn[s], true); }
});
addEventListener('keyup', e => {
  const a = keyMap[e.code], s = sysMap[e.code];
  if (a) { release(a); flash(padBtn[a], false); } else if (s) flash(sysBtn[s], false);
});
addEventListener('blur', () => Object.keys(K.held).forEach(release));
document.addEventListener('visibilitychange', () => { if (document.hidden && K.state === 'play') K.paused = true; });

function bindPointer(el, down, up) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); window.focus(); try { el.setPointerCapture(e.pointerId); } catch (x) {} flash(el, true); down(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, () => { flash(el, false); up(); }));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
Object.entries(padBtn).forEach(([a, el]) => bindPointer(el, () => press(a), () => release(a)));
Object.entries(sysBtn).forEach(([a, el]) => bindPointer(el, () => sys(a), () => {}));

/* ---------- Decorations: side rails + shell colours ---------- */
const TETRO = [['.X.','XXX'], ['XX.','.XX'], ['.XX','XX.'], ['X..','XXX'], ['..X','XXX'], ['XXXX'], ['XX','XX']];
function buildRail(el, off) {
  for (let i = 0; i < 8; i++) {
    const t = TETRO[(i + off) % 7], d = document.createElement('div'); d.className = 'tet';
    d.style.gridTemplateColumns = `repeat(${t[0].length},auto)`;
    t.forEach(r => [...r].forEach(ch => { const c = document.createElement('i'); if (ch === 'X') c.className = 'b'; d.appendChild(c); }));
    el.appendChild(d);
  }
}
buildRail($('#railL'), 0); buildRail($('#railR'), 3);
const THEMES = [   // finishes; [0] Classic Yellow = original shell colour (default)
  { n:'Classic Yellow', b:['#ffe45c','#f6c915','#cf9f00'], edge:'rgba(255,255,255,.55)', txt:'#6b4a00', txt2:'rgba(107,74,0,.7)', acc:'#c62a1d', sheen:0,
    k:['#5d626c','#2a2d33','#111317'], chev:'#e6eaf0', a:['#ff8576','#d92f20','#861609'], glow:'rgba(217,47,32,.4)' },
  { n:'Midnight',  b:['#22335c','#0f1938','#070c1c'], edge:'rgba(130,190,255,.25)', txt:'rgba(225,238,255,.8)', txt2:'rgba(225,238,255,.45)', acc:'#42e8f5',
    k:['#2b3860','#141c36','#070b17'], chev:'#d6e8ff', a:['#7af5ff','#0878f9','#04265e'], glow:'rgba(66,232,245,.5)' },
  { n:'Graphite',  b:['#464a53','#24272d','#0e0f12'], edge:'rgba(255,255,255,.2)', txt:'rgba(240,244,250,.82)', txt2:'rgba(240,244,250,.45)', acc:'#42e8f5',
    k:['#4a4f5a','#25282f','#0d0e11'], chev:'#e6eefb', a:['#7af5ff','#0878f9','#04265e'], glow:'rgba(66,232,245,.45)' },
  { n:'Platinum',  b:['#fbfcfe','#d9dee9','#aeb6c8'], edge:'rgba(255,255,255,.9)', txt:'rgba(24,36,70,.85)', txt2:'rgba(24,36,70,.5)', acc:'#0878f9',
    k:['#3a4568','#1c2440','#0a0f20'], chev:'#e4eeff', a:['#7af5ff','#0878f9','#04265e'], glow:'rgba(8,120,249,.45)' },
  { n:'Champagne', b:['#f6e6bf','#d6b673','#9c7a3b'], edge:'rgba(255,248,225,.85)', txt:'rgba(58,40,8,.88)', txt2:'rgba(58,40,8,.5)', acc:'#7a4f00',
    k:['#4a3d27','#241d11','#0d0a05'], chev:'#f8e8c2', a:['#ffe9b0','#c9973a','#6b4a10'], glow:'rgba(201,151,58,.5)' }
];
function setShell(i) {
  const t = THEMES[i], r = document.documentElement.style;
  [['--b1', t.b[0]], ['--b2', t.b[1]], ['--b3', t.b[2]], ['--edge', t.edge], ['--txt', t.txt], ['--txt2', t.txt2], ['--acc', t.acc],
   ['--k1', t.k[0]], ['--k2', t.k[1]], ['--k3', t.k[2]], ['--chev', t.chev], ['--a1', t.a[0]], ['--a2', t.a[1]], ['--a3', t.a[2]], ['--glow', t.glow], ['--sheen', t.sheen === undefined ? .10 : t.sheen]]
    .forEach(([k, v]) => r.setProperty(k, v));
  Store.set('theme3', i);
}
THEMES.forEach((t, i) => { const b = document.createElement('button'); b.style.background = `linear-gradient(135deg,${t.b[0]},${t.b[2]})`;
  b.setAttribute('aria-label', t.n + ' finish'); b.title = t.n; b.addEventListener('click', () => setShell(i)); $('#dots').appendChild(b); });
setShell(clamp(Store.get('theme3', 0), 0, THEMES.length - 1));

/* ============================================================
   6. Main loop: update -> compose frame buffer -> paint LCD
   ============================================================ */
const icoSnd = $('#icoSnd'), icoPause = $('#icoPause'), icoCup = $('#icoCup'), caption = $('#caption');
const pad2 = n => String(n).padStart(2, '0');

function composeBuffer() {
  const buf = K.buf, nx = K.nxt; nx.fill(0);
  if (K.state === 'curtain') return;                         // curtain wrote buf itself
  buf.fill(0);
  switch (K.state) {
    case 'boot': buf.fill(1); break;                          // full segment test
    case 'menu': {
      const num = pad2(K.mode);
      for (let i = 0; i < 2; i++) { const g = F3[num[i]]; for (let k = 0; k < 15; k++) if (g[k] === '1') px(buf, 1 + i * 5 + (k % 3), 2 + ((k / 3) | 0)); }
      ICONS[K.mode - 1]((x, y) => px(buf, x, y + 10), ((K.t / 450) | 0) % 2);
      break; }
    case 'play': if (K.game) { K.game.draw(buf); K.game.next(nx); } break;
    case 'over': if (((K.t / 500) | 0) % 2) stamp(buf, 1, 6, SAD); break;
  }
}

function update(dt) {
  K.t += dt;
  switch (K.state) {
    case 'boot': K.bootT += dt; if (K.bootT > 650) startCurtain(toMenu, 'menu'); break;
    case 'curtain': updateCurtain(dt); break;
    case 'play': if (!K.paused && K.game) K.game.update(dt); break;
    case 'over': K.overT += dt; break;
  }
}

function renderUI() {
  const st = K.state === 'curtain' ? K.cvs : K.state;
  let hi = '', sc = '', lv = '', sp = '';
  if (K.power) {
    if (st === 'boot') { hi = sc = '888888'; lv = sp = '88'; }
    else if (st === 'menu') { hi = K.hi; sc = '    ' + pad2(K.mode); lv = K.sel.level; sp = K.sel.speed; }
    else { hi = K.hi; sc = K.score; lv = K.level; sp = K.speed; }
  }
  dHi.set(hi); dScore.set(sc); dLevel.set(lv); dSpeed.set(sp);
  icoSnd.classList.toggle('on', K.power); icoSnd.classList.toggle('mute', !Sound.enabled);
  icoPause.classList.toggle('on', K.power && (st === 'boot' || (K.paused && ((K.t / 500) | 0) % 2 === 0)));
  icoCup.classList.toggle('on', K.power && (st === 'boot' || (K.newRecord && ((K.t / 250) | 0) % 2 === 0)));
  const cap = !K.power ? 'PRESS ON/OFF  (O)'
    : st === 'menu' ? pad2(K.mode) + ' ' + MODES[K.mode - 1].name + ' - ◀▶ MODE ▲▼ SPEED ● LEVEL START'
    : st === 'over' ? 'GAME OVER - PRESS START'
    : K.paused ? 'PAUSED' : MODES[K.mode - 1].name;
  if (caption.textContent !== cap) caption.textContent = cap;
}

function paint() {
  const buf = K.buf, nx = K.nxt;
  drawMatrix(gridCtx, W, H, 32, (x, y) => buf[y * W + x]);
  drawMatrix(nextCtx, 4, 4, 24, (x, y) => nx[y * 4 + x]);
  // mascot reacts to clears / game over, idles otherwise
  const m = K.mascot; if (m.s !== 'idle' && K.t > m.until) m.s = 'idle';
  const fr = MASCOT[K.power ? m.s : 'idle'], sprite = fr[((K.t / 420) | 0) % fr.length];
  mascotCtx.clearRect(0, 0, 100, 120);
  for (let y = 0; y < 6; y++) for (let x = 0; x < 5; x++) drawCell(mascotCtx, x, y, 20, K.power && sprite[y][x] === 'X');
}

let last = performance.now();
function frame(ts) {
  const dt = Math.min(50, ts - last); last = ts;
  update(dt); composeBuffer(); renderUI(); paint();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.focus();

/* test hook (harmless in production) */
window.__bb = K;
})();
</script>
