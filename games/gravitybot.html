<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rovatics Gravity Bot</title>
<style>
  :root{--panel:rgba(255,255,255,.07);--line:rgba(140,170,255,.3);--text:#f2f6ff;--muted:#a9b9ee;--accent:#7be8ff;
        --grad:linear-gradient(110deg,#6a5cff,#7be8ff);--good:#5dffa0;--bad:#ff5d73;--gold:#ffd24a}
  html{overflow-x:hidden}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--text);padding:12px;
       background:radial-gradient(ellipse at 20% 0%,#2a1a6e,transparent 55%),radial-gradient(ellipse at 90% 100%,#0a3b63,transparent 55%),#04061a fixed}
  button{font:inherit;color:inherit;cursor:pointer}
  .screen{position:relative;z-index:1;max-width:1000px;margin:0 auto}
  .screen[hidden]{display:none}
  .btn{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700}
  .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--grad);color:#050a24;border:0}
  .btn.primary:hover:not(:disabled){color:#050a24;filter:brightness(1.12)}
  h1{margin:0;font-size:clamp(2rem,7vw,3.4rem);line-height:1.05}
  .glow{background:linear-gradient(90deg,#7be8ff,#b48bff,#ff7bd9,#ffd24a,#7be8ff);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:slide 6s linear infinite}
  @keyframes slide{to{background-position:200% 0}}
  .sub{color:var(--muted);margin:8px 0 16px;max-width:660px}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 0 4px}
  .planet-row{display:flex;gap:14px;align-items:center;margin:8px 0}
  .pl{border-radius:50%;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .rank{display:flex;flex-direction:column;gap:6px;align-items:center;margin:6px auto 0;padding:12px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:260px}
  .rank b{font-size:1.15rem;color:var(--gold)} .rank .bar{width:100%;height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden} .rank .bar i{display:block;height:100%;background:var(--grad);transition:width .6s}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
  .mode{padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--panel);text-align:left;transition:.2s}
  .mode:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 30px rgba(123,232,255,.2)}
  .mode .e{font-size:2.2rem} .mode b{display:block;font-size:1.25rem;margin:4px 0} .mode span{color:var(--muted);font-size:.92rem}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .toprow{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:10px}
  .worlds{display:grid;gap:14px}
  .world{padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--panel)} .world.locked{opacity:.45}
  .world h3{margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:1.1rem} .world p{margin:2px 0 10px;color:var(--muted);font-size:.88rem}
  .lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
  .lv{padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);text-align:center;font-weight:800;line-height:1.1}
  .lv small{display:block;font-weight:400;color:var(--gold);letter-spacing:1px;min-height:1em}
  .lv:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)} .lv:disabled{opacity:.35;cursor:not-allowed}
  .lv.next{border-color:var(--gold);animation:pulse 1.5s infinite} @keyframes pulse{50%{box-shadow:0 0 18px rgba(255,210,74,.6)}}
  .hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:.95rem} .chip b{color:var(--accent)}
  .fuel{display:inline-block;width:70px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;vertical-align:middle;margin-left:4px}
  .fuel i{display:block;height:100%;background:linear-gradient(90deg,#ff7b3d,#ffd24a);transition:width .1s}
  .boardbox{display:flex;justify-content:center}
  canvas#cv{border-radius:18px;border:1px solid var(--line);background:#050820;touch-action:none;cursor:crosshair;max-width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  .tip{text-align:center;color:var(--muted);font-size:.92rem;min-height:1.4em;margin:10px 0 0}
  #toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-300%);padding:11px 22px;border-radius:999px;background:var(--grad);color:#050a24;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:80;max-width:92vw;text-align:center}
  #toast.show{transform:translate(-50%,0)}
  .overlay{position:fixed;inset:0;background:rgba(2,4,20,.82);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
  .overlay[hidden]{display:none}
  .modal{background:linear-gradient(160deg,#1c1a5e,#0a1a4a);border:1px solid var(--accent);border-radius:22px;padding:22px 24px;max-width:480px;width:100%;text-align:center;animation:pop .45s;max-height:92vh;overflow:auto}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  .modal h2{margin:4px 0 6px;font-size:1.7rem} .modal p{color:var(--muted);margin:6px 0}
  .bigstars{font-size:2.6rem;letter-spacing:8px;color:var(--gold)} .bigstars span{display:inline-block;animation:starIn .5s both}
  @keyframes starIn{from{transform:scale(0) rotate(-180deg);opacity:0}}
  .goals{text-align:left;display:inline-block;margin:8px 0} .goals div{margin:3px 0} .ok{color:var(--good)} .no{color:var(--muted)}
  .score{margin:8px auto;max-width:340px;text-align:left} .score div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08);animation:fadeIn .4s both} .score .tot{border:0;font-size:1.3rem;font-weight:800;color:var(--accent);padding-top:8px}
  @keyframes fadeIn{from{opacity:0;transform:translateX(-10px)}}
  .promo{margin:8px 0;padding:10px;border-radius:14px;background:rgba(255,210,74,.15);border:1px solid var(--gold);color:var(--gold);font-weight:800;animation:pop .6s}
  .how{text-align:left;color:var(--muted);padding-left:18px} .how li{margin:7px 0}
  .tlist,.alist{display:grid;gap:8px;text-align:left}
  .titem{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--panel);width:100%}
  .titem.sel{border-color:var(--accent);box-shadow:0 0 14px rgba(123,232,255,.4)} .titem:disabled{opacity:.45}
  .sw{display:flex;gap:4px} .sw i{width:16px;height:16px;border-radius:50%}
  .aitem{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel)} .aitem.off{opacity:.4;filter:grayscale(1)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:75}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<section class="screen" id="menu">
  <div class="hero">
    <div class="planet-row" aria-hidden="true">
      <div class="pl" style="width:34px;height:34px;background:radial-gradient(circle at 30% 30%,#ffd9a8,#c0662b 60%,#4a1f0a)"></div>
      <div class="pl" style="width:56px;height:56px;animation-delay:.5s;background:radial-gradient(circle at 30% 30%,#a8f0ff,#2b7fc0 60%,#0a2a4a)"></div>
      <div class="pl" style="width:26px;height:26px;animation-delay:1s;background:radial-gradient(circle at 30% 30%,#ffa8e8,#c02b9a 60%,#4a0a3a)"></div>
    </div>
    <h1>🛰️ <span class="glow">Gravity Bot</span></h1>
    <p class="sub">Pull back, aim and launch your robot probe! Bend its path around drifting planets, suns and black holes, then steer through the final stretch to dock at the charging station.</p>
    <div class="rank" id="rankBox"></div>
  </div>
  <div class="modes">
    <button class="mode" id="mCamp" type="button"><div class="e">🌌</div><b>Campaign</b><span id="campInfo">100 levels · 10 galaxies</span></button>
    <button class="mode" id="mEnd" type="button"><div class="e">♾️</div><b>Deep Space</b><span id="endInfo">Endless sectors — 3 hulls, how far can you go?</span></button>
  </div>
  <div class="row" style="margin-top:0"><button class="btn" id="howBtn">❓ How to play</button><button class="btn" id="skinBtn">🤖 Skins</button><button class="btn" id="achBtn">🏅 Awards</button><button class="btn" id="muteBtn">🔊</button></div>
</section>

<section class="screen" id="map" hidden>
  <div class="toprow"><button class="btn" id="mapBack">☰ Menu</button><span class="chip" id="starTotal">⭐ 0 / 300</span></div>
  <div class="worlds" id="worlds"></div>
</section>

<section class="screen" id="play" hidden>
  <div class="hud">
    <button class="btn" id="backBtn">☰ Back</button>
    <div class="chips"><span class="chip" id="titleChip">Level 1</span><span class="chip" id="shotChip"></span><span class="chip" id="orbChip"></span><span class="chip" id="fuelChip">⛽ <span class="fuel"><i id="fuelBar" style="width:100%"></i></span></span></div>
  </div>
  <div class="boardbox"><canvas id="cv" aria-label="Gravity Bot play field"></canvas></div>
  <div class="acts">
    <button class="btn" id="hintBtn">💡 Hint (3)</button>
    <button class="btn" id="ffBtn">⏩ Skip flight</button>
    <button class="btn" id="resetBtn">↺ Restart</button>
  </div>
  <p class="tip" id="tip"></p>
</section>

<div id="toast" role="status"></div>
<canvas id="confetti"></canvas>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script src="gravitybot-engine.js"></script>
<script src="gravitybot-levels.js"></script>
<script>
(function () {
  'use strict';
  var GE = window.GravityBotEngine, LD = window.GravityBotLevels, KEY = 'rovatics.gravitybot.v2', W = GE.W, H = GE.H, N_LEVELS = GE.LEVELS;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  var save = { stars: {}, scores: {}, orbs: 0, skin: 0, ach: {}, best: 0, muted: false, seenHow: false };
  try { var sv = JSON.parse(localStorage.getItem(KEY)); if (sv) save = Object.assign(save, sv); } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
  var toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2400); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  // ---------- skins, ranks & awards ----------
  var SKINS = [
    { name: 'Classic Blue', need: 0, c: ['#7be8ff', '#4d8dff'] }, { name: 'Solar Flare', need: 12, c: ['#ffd24a', '#ff6b3d'] },
    { name: 'Mint Comet', need: 35, c: ['#8cffc8', '#2bd9a0'] }, { name: 'Rose Quartz', need: 70, c: ['#ffb3e6', '#ff5db8'] },
    { name: 'Golden Rush', need: 120, c: ['#fff1a8', '#ffb300'] }, { name: 'Rainbow Nova', need: 180, c: ['#ff4d6d', '#ffe34d', '#4dff88', '#4da6ff', '#b44dff'] }
  ];
  var ACH = [
    { id: 'first', e: '🛰️', t: 'First Docking', d: 'Reach a charging station' },
    { id: 'three', e: '⭐', t: 'Triple Star', d: 'Earn 3 stars on a level' },
    { id: 'oneshot', e: '🎯', t: 'Sharpshooter', d: 'Win a level from galaxy 3+ in a single shot' },
    { id: 'thrust', e: '🔥', t: 'Course Correction', d: 'Save a shot by steering with thrust' },
    { id: 'bull', e: '🎯', t: 'Bullseye', d: 'Dock right in the centre of the station' },
    { id: 'warp', e: '🌀', t: 'Warp Pilot', d: 'Win a level by flying through a portal' },
    { id: 'orbs50', e: '🔋', t: 'Energy Hoarder', d: 'Collect 50 energy cells' },
    { id: 'perfect10', e: '🏆', t: 'Perfectionist', d: 'Earn 3 stars on 10 levels' },
    { id: 'world', e: '🌌', t: 'Galaxy Cleared', d: 'Clear every level of a galaxy' },
    { id: 'bh', e: '🕳️', t: 'Event Horizon', d: 'Win a level in Black Hole Alley' },
    { id: 'capt', e: '🎖️', t: 'Captain on Deck', d: 'Reach the rank of Captain' },
    { id: 'end5', e: '♾️', t: 'Deep Diver', d: 'Clear 5 sectors in Deep Space' },
    { id: 'end15', e: '🚀', t: 'Void Walker', d: 'Clear 15 sectors in Deep Space' },
    { id: 'stars100', e: '🌠', t: 'Star Collector', d: 'Collect 100 stars' }
  ];
  function totalStars() { var s = 0; Object.keys(save.stars).forEach(function (k) { s += save.stars[k]; }); return s; }
  function totalScore() { var s = 0; Object.keys(save.scores).forEach(function (k) { s += save.scores[k]; }); return s; }
  function skin() { var s = SKINS[save.skin] || SKINS[0]; return totalStars() >= s.need ? s : SKINS[0]; }
  function award(id) { if (save.ach[id]) return; save.ach[id] = Date.now(); persist(); var a = ACH.filter(function (x) { return x.id === id; })[0]; toast(a.e + ' Award unlocked: ' + a.t + '!'); SFX.fanfare(); }
  function renderRank() {
    var ts = totalStars(), r = GE.rankFor(ts), box = $('rankBox'); box.innerHTML = '';
    box.appendChild(el('b', '', '🎖️ ' + r.name));
    var bar = el('div', 'bar'), fill = el('i'); fill.style.width = (r.next ? Math.min(100, (ts - r.from) / (r.next[1] - r.from) * 100) : 100) + '%'; bar.appendChild(fill); box.appendChild(bar);
    box.appendChild(el('span', 'sub', r.next ? '⭐ ' + ts + ' — ' + (r.next[1] - ts) + ' more to reach ' + r.next[0] : '⭐ ' + ts + ' — highest rank achieved!')); box.lastChild.style.margin = '0'; box.lastChild.style.fontSize = '.85rem';
  }

  // ---------- sound ----------
  var ac = null;
  function refreshMute() { $('muteBtn').textContent = save.muted ? '🔇' : '🔊'; }
  $('muteBtn').onclick = function () { save.muted = !save.muted; persist(); refreshMute(); }; refreshMute();
  function tone(f, d, type, when, vol, slide) {
    if (save.muted) return;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when || 0);
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
      g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) {}
  }
  var SFX = {
    launch: function (p) { tone(160 + p * 200, .35, 'sawtooth', 0, .06, 900 + p * 500); },
    orb: function (k) { tone(660 * Math.pow(1.122, k * 2), .18, 'sine', 0, .1); tone(990 * Math.pow(1.122, k * 2), .22, 'triangle', .06, .06); },
    crash: function () { tone(160, .4, 'sawtooth', 0, .1, 40); tone(90, .5, 'square', .05, .08, 30); },
    lost: function () { tone(440, .6, 'sine', 0, .07, 110); },
    warp: function () { tone(300, .3, 'sine', 0, .09, 1200); tone(1200, .3, 'triangle', .05, .06, 300); },
    thrust: function () { tone(120, .08, 'sawtooth', 0, .035, 90); },
    goal: function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, .22, 'triangle', i * .1, .11); }); },
    fanfare: function () { [659, 784, 988, 1319].forEach(function (f, i) { tone(f, .2, 'triangle', i * .09, .09); }); }
  };
  document.addEventListener('pointerdown', function () { if (ac && ac.state === 'suspended') ac.resume(); });

  // ---------- state ----------
  var mode = null, L = null, lvN = 0, shots = 3, shotsUsed = 0, hintsLeft = 3, phase = 'aim', drag = null, flight = null, ghost = null, aimPred = null;
  var endless = null, parts = [], rings = [], shake = 0, collected = {}, hold = null, spaceHeld = false, warpsSeen = 0, usedWarp = false, lastThrustSfx = 0;
  var cv = $('cv'), cx = cv.getContext('2d'), sc = 1, dpr = window.devicePixelRatio || 1;

  // ---------- menu / map ----------
  function show(id) { ['menu', 'map', 'play'].forEach(function (s) { $(s).hidden = s !== id; }); $('overlay').hidden = true; }
  function refreshMenu() {
    var done = Object.keys(save.stars).length;
    $('campInfo').textContent = done + ' / ' + N_LEVELS + ' levels cleared · ⭐ ' + totalStars() + (totalScore() ? ' · 🏆 ' + fmt(totalScore()) : '');
    $('endInfo').textContent = save.best ? 'Endless sectors · Best score ' + fmt(save.best) : 'Endless sectors — 3 hulls, how far can you go?';
    renderRank();
  }
  function unlocked(n) { return n === 1 || !!save.stars[n - 1] || !!save.stars[n]; }
  function renderMap() {
    var box = $('worlds'); box.innerHTML = ''; var nextShown = false;
    GE.WORLDS.forEach(function (w, wi) {
      var ws = 0, card = el('div', 'world'), grid = el('div', 'lvgrid'), anyOpen = false;
      for (var i = 0; i < 10; i++) (function (n) {
        var st = save.stars[n] || 0; ws += st; var open = unlocked(n); if (open) anyOpen = true;
        var b = el('button', 'lv' + (open && !st && !nextShown ? ' next' : '')); b.type = 'button'; b.disabled = !open; if (open && !st) nextShown = true;
        b.appendChild(document.createTextNode(open ? String(n) : '🔒')); b.appendChild(el('small', '', st ? '★'.repeat(st) + '☆'.repeat(3 - st) : ''));
        b.onclick = function () { startLevel(n); }; grid.appendChild(b);
      })(wi * 10 + i + 1);
      if (!anyOpen) card.classList.add('locked');
      var h = el('h3'); h.appendChild(el('span', '', (wi + 1) + '. ' + w.name)); h.appendChild(el('span', '', '⭐ ' + ws + '/30'));
      card.appendChild(h); card.appendChild(el('p', '', w.blurb)); card.appendChild(grid); box.appendChild(card);
    });
    $('starTotal').textContent = '⭐ ' + totalStars() + ' / ' + N_LEVELS * 3 + (totalScore() ? '  ·  🏆 ' + fmt(totalScore()) : '');
  }
  $('mCamp').onclick = function () { renderMap(); show('map'); };
  $('mapBack').onclick = function () { refreshMenu(); show('menu'); };
  $('backBtn').onclick = function () { flight = null; hold = null; if (mode === 'endless') { refreshMenu(); show('menu'); } else { renderMap(); show('map'); } };

  // ---------- starting levels ----------
  function setupLevel(level) {
    L = level; shots = 3; shotsUsed = 0; phase = 'aim'; drag = null; flight = null; hold = null; ghost = null; aimPred = null; parts = []; rings = []; collected = {}; warpsSeen = 0; usedWarp = false;
    show('play'); resize(); updateHud();
  }
  function startLevel(n) {
    mode = 'campaign'; lvN = n; hintsLeft = 3; var lv = LD.LEVELS[n - 1]; if (!lv.portals) lv.portals = [];
    setupLevel(lv);
    $('titleChip').textContent = 'Galaxy ' + (lv.world + 1) + ' · Level ' + n;
    var moving = lv.bodies.some(function (b) { return b.mv; });
    $('tip').textContent = n === 1 ? '👆 Press, drag BACK from anywhere, then release to launch. While flying, HOLD to steer (limited fuel)!' : (GE.WORLDS[lv.world].blurb + (moving ? '  ⏱️ Worlds start moving when you launch.' : ''));
    updateHud();
  }
  function startEndless() {
    mode = 'endless'; endless = { seed: (Date.now() & 0xffffff) + 1, k: 1, score: 0, hulls: 3, hints: 2, cleared: 0, next: null };
    nextSector();
  }
  function genSector(k) { try { return GE.endlessLevel(endless.seed, k); } catch (e) { endless.seed++; return GE.endlessLevel(endless.seed, k); } }
  function nextSector() {
    var lv = endless.next && endless.next.k === endless.k ? endless.next.L : null; endless.next = null;
    if (!lv) { toast('🛰️ Charting sector ' + endless.k + '…'); setTimeout(function () { endless.cur = genSector(endless.k); enterSector(); }, 30); return; }
    endless.cur = lv; enterSector();
  }
  function enterSector() {
    hintsLeft = endless.hints; setupLevel(endless.cur);
    $('titleChip').textContent = '♾️ Sector ' + endless.k; $('tip').textContent = 'Each sector is brand new! Out of shots costs a hull. Hold to steer mid-flight.'; updateHud();
    var k = endless.k, sd = endless.seed; // prefetch the next sector while the player thinks
    setTimeout(function () { if (mode === 'endless' && endless.k === k && endless.seed === sd && !endless.next) { try { endless.next = { k: k + 1, L: GE.endlessLevel(sd, k + 1) }; } catch (e) {} } }, 2500);
  }
  $('mEnd').onclick = startEndless;

  function updateHud() {
    if (!L) return;
    $('shotChip').innerHTML = (mode === 'endless' ? '❤ ' + endless.hulls + ' · Score <b>' + fmt(endless.score) + '</b> · ' : '') + 'Shots <b>' + shots + '</b>';
    $('orbChip').innerHTML = '🔋 <b>' + Object.keys(collected).length + '</b>/' + L.orbs.length;
    $('hintBtn').textContent = '💡 Hint (' + hintsLeft + ')'; $('hintBtn').disabled = hintsLeft <= 0 || phase !== 'aim';
    $('ffBtn').hidden = phase !== 'fly';
  }

  // ---------- coordinates & input ----------
  function resize() {
    var avail = Math.min($('play').clientWidth || 800, 980); if (avail < 200) avail = 800;

    var g = cx.createRadialGradient(o.x - 3, o.y - 3, 1, o.x, o.y, 12 * p); g.addColorStop(0, '#fff'); g.addColorStop(.5, '#ffe34d'); g.addColorStop(1, '#ff9d00'); cx.fillStyle = g; cx.beginPath(); cx.arc(o.x, o.y, 11 * p, 0, 6.283); cx.fill();

  }

    if (flying) { cx.rotate(a); var fl = (thrusting ? 26 : 14) + Math.random() * 10; var gg = cx.createLinearGradient(-fl - 6, 0, 0, 0); gg.addColorStop(0, 'rgba(255,160,40,0)'); gg.addColorStop(1, thrusting ? 'rgba(255,255,200,1)' : 'rgba(255,230,120,.9)'); cx.fillStyle = gg; cx.beginPath(); cx.moveTo(-6, -7); cx.lineTo(-6 - fl, 0); cx.lineTo(-6, 7); cx.closePath(); cx.fill(); cx.rotate(-a); }

  function frame(now) {

    if (!L || $('play').hidden) return;
