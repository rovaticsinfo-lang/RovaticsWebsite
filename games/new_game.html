<main class="games-page">
  <h1>Games</h1>
  <p>Pick a game to play right here.</p>

  <div id="game-grid"></div>

  <div id="game-player" hidden>
    <div class="gp-bar">
      <strong id="gp-title"></strong>
      <span>
        <a id="gp-full" target="_blank" rel="noopener">Open full screen ↗</a>
        <button id="gp-close" type="button">Close ✕</button>
      </span>
    </div>
    <iframe id="gp-frame" title="Game" allowfullscreen></iframe>
  </div>
</main>

<style>
  .games-page{max-width:1100px;margin:0 auto;padding:32px 20px}
  #game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin:24px 0}
  .game-card{padding:20px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);cursor:pointer;text-align:left;color:inherit;font:inherit}
  .game-card:hover{border-color:#42e8f5;transform:translateY(-2px)}
  .game-card .emoji{font-size:2.2rem}
  .game-card h3{margin:8px 0 4px}
  .game-card p{margin:0;opacity:.8}
  #game-player{margin-top:24px}
  .gp-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
  .gp-bar a,.gp-bar button{margin-left:12px;color:inherit;background:none;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;font:inherit}
  #gp-frame{width:100%;height:80vh;min-height:650px;border:0;border-radius:16px}
</style>

<script>
  const grid = document.getElementById('game-grid');
  const player = document.getElementById('game-player');
  const frame = document.getElementById('gp-frame');

  function play(g) {
    const url = 'games/' + g.file;
    frame.src = url;
    document.getElementById('gp-title').textContent = g.title;
    document.getElementById('gp-full').href = url;
    player.hidden = false;
    player.scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('gp-close').onclick = () => {
    frame.src = 'about:blank';
    player.hidden = true;
  };

  fetch('games/games.json')
    .then(r => r.json())
    .then(list => {
      list.forEach(g => {
        const b = document.createElement('button');
        b.className = 'game-card';
        b.type = 'button';
        const e = document.createElement('div'); e.className = 'emoji'; e.textContent = g.emoji || '🎮';
        const h = document.createElement('h3'); h.textContent = g.title;
        const p = document.createElement('p'); p.textContent = g.description || '';
        b.append(e, h, p);
        b.onclick = () => play(g);
        grid.appendChild(b);
      });
    })
    .catch(() => { grid.textContent = 'Games are coming soon.'; });
</script>
