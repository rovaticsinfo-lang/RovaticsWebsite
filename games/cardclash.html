<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rovatics Card Clash</title>
<style>
  :root{--bg:#06122e;--bg2:#0a1d4a;--panel:rgba(255,255,255,.07);--line:rgba(140,200,255,.3);--text:#f2f8ff;--muted:#a9c4ee;
        --accent:#42e8f5;--grad:linear-gradient(110deg,#0878f9,#42e8f5);--good:#5dffa0;--bad:#ff5d73;--gold:#ffd24a;
        --c1:#0878f9;--c2:#42e8f5}
  html{overflow-x:hidden}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--text);overflow-x:hidden;
       background:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--c1) 35%,#06122e),transparent 60%),
                  radial-gradient(ellipse at 90% 100%,color-mix(in srgb,var(--c2) 25%,#06122e),transparent 55%),#06122e fixed;padding:12px}
  button{font:inherit;color:inherit;cursor:pointer}
  .btn{padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700}
  .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--grad);color:#04142d;border:0}
  .btn.primary:hover:not(:disabled){color:#04142d;filter:brightness(1.12)}
  .btn.sm{padding:5px 12px;font-size:.85rem}
  input[type=text]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);font:inherit}
  .screen{max-width:1000px;margin:0 auto}
  .screen[hidden]{display:none}
  h1{margin:0 0 4px;font-size:clamp(1.6rem,5vw,2.4rem)}
  .sub{color:var(--muted);margin:0 0 18px}
  .card-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)} .small{font-size:.85rem}
  .bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bgfx span{position:absolute;bottom:-60px;font-size:2rem;opacity:.12;animation:floatUp linear infinite}
  @keyframes floatUp{to{transform:translateY(-115vh) rotate(360deg)}}
  .screen,.topbar{position:relative;z-index:1}
  .topbar{display:flex;justify-content:flex-end;gap:8px;max-width:1000px;margin:0 auto 8px}

  /* deck picker */
  .decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .deckbtn{padding:16px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(150deg,var(--a),var(--b));text-align:left;position:relative;overflow:hidden;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .deckbtn.sel{border-color:#fff;box-shadow:0 0 0 3px var(--accent),0 10px 30px rgba(0,0,0,.4);transform:translateY(-2px)}
  .deckbtn .e{font-size:2.4rem} .deckbtn b{display:block;font-size:1.05rem} .deckbtn small{opacity:.9}
  .deckbtn:disabled{cursor:default}
  /* lobby seats */
  .seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .seat{padding:14px;border-radius:14px;border:1px dashed var(--line);min-height:84px;display:flex;align-items:center;gap:12px}
  .seat.full{border-style:solid;background:var(--panel)}
  .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:#04142d;flex:none}
  .code{font-size:2.4rem;letter-spacing:.35em;font-weight:800;color:var(--accent);padding-left:.35em}

  /* table */
  .seatsbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
  .pl{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--panel);border:2px solid var(--line);transition:.3s;position:relative}
  .pl.teller{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,74,.5)}
  .pl.out{opacity:.35;filter:grayscale(1)}
  .pl.me .nm::after{content:" (you)";color:var(--muted);font-weight:400}
  .pl .nm{font-weight:700;font-size:.95rem;line-height:1.1} .pl .ct{font-size:.8rem;color:var(--muted)}
  .stack{position:relative;width:26px;height:36px;flex:none}
  .stack i{position:absolute;inset:0;border-radius:5px;background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid #fff5}
  .crown{position:absolute;top:-14px;left:10px;font-size:1.2rem;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .arena{min-height:250px;border-radius:22px;border:1px solid var(--line);background:rgba(2,10,30,.55);padding:14px;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:10px;margin-bottom:12px;position:relative;overflow:hidden}
  .banner{font-size:clamp(1rem,3.4vw,1.5rem);font-weight:800;text-align:center;min-height:1.6em}
  .banner.win{color:var(--gold);animation:pop .6s} .banner.lose{color:var(--bad)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .plays{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .slot{display:flex;flex-direction:column;align-items:center;gap:6px;animation:slideIn .5s both}
  .slot .who{font-weight:700;font-size:.9rem}
  @keyframes slideIn{from{transform:translateY(40px) scale(.8);opacity:0}}
  .flip{width:132px;height:190px;perspective:800px}
  .flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
  .flip.up .in{transform:rotateY(180deg)}
  .flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px}
  .flip .b{background:repeating-linear-gradient(45deg,var(--c1),var(--c1) 8px,var(--c2) 8px,var(--c2) 16px);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:3rem}
  .flip .f{transform:rotateY(180deg);background:linear-gradient(160deg,hsl(var(--h) 65% 38%),#0b1a44);border:3px solid #fff8;padding:8px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
  .flip .f .em{font-size:2.4rem} .flip .f .nmm{font-weight:800;font-size:.8rem;line-height:1.1}
  .flip .f .val{font-size:2rem;font-weight:900;color:var(--accent);text-shadow:0 0 12px var(--accent)} .flip .f .al{font-size:.7rem;color:var(--muted)}
  .slot.winner .flip{animation:winGlow 1s ease-in-out infinite alternate}
  .slot.winner .f{border-color:var(--gold)}
  .slot.loser{opacity:.45;transform:scale(.92);transition:.5s}
  @keyframes winGlow{to{filter:drop-shadow(0 0 16px var(--gold));transform:translateY(-6px)}}
  .mine{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-start}

  /* the big card */
  .card{width:min(330px,92vw);border-radius:20px;padding:3px;position:relative;transform-style:preserve-3d;transition:transform .15s;
        background:linear-gradient(135deg,#8fa8d6,#e6efff,#8fa8d6);animation:deal .6s cubic-bezier(.2,1.2,.4,1)}
  .card.legendary{background:linear-gradient(135deg,#ffd24a,#fff6c9,#ff9d2e,#ffd24a);box-shadow:0 0 30px rgba(255,210,74,.55)}
  .card.epic{background:linear-gradient(135deg,#b46bff,#ecd7ff,#6b8bff)} .card.rare{background:linear-gradient(135deg,#3fa9ff,#d5efff,#42e8f5)}
  @keyframes deal{from{transform:translateY(60px) rotate(-6deg) scale(.85);opacity:0}}
  .card .inner{border-radius:17px;overflow:hidden;background:#091738;position:relative}
  .card .art{height:112px;display:flex;align-items:center;justify-content:center;font-size:4.2rem;position:relative;
             background:radial-gradient(circle at 50% 40%,hsl(var(--h) 80% 55% / .9),hsl(var(--h) 60% 22%) 70%)}
  .card .art .big{filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));animation:bob 2.4s ease-in-out infinite}
  .card .tier{position:absolute;top:8px;right:10px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.45)}
  .card .nmrow{padding:8px 14px 2px} .card .nmrow b{font-size:1.25rem;display:block;line-height:1.1} .card .nmrow span{color:var(--muted);font-size:.85rem}
  .card .attrs{padding:6px 10px 12px;display:grid;gap:5px}
  .attr{display:grid;grid-template-columns:26px 1fr auto;grid-template-areas:"i l v" "b b b";align-items:center;column-gap:8px;padding:6px 10px;border-radius:10px;
        border:1px solid transparent;background:rgba(255,255,255,.05);text-align:left;width:100%}
  .attr .i{grid-area:i;font-size:1.1rem} .attr .l{grid-area:l;font-weight:600;font-size:.92rem} .attr .v{grid-area:v;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
  .attr .bar{grid-area:b;height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:4px;overflow:hidden}
  .attr .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .8s}
  .attr.best .l::after{content:" ★";color:var(--gold)}
  button.attr:hover:not(:disabled){border-color:var(--accent);background:rgba(66,232,245,.15);transform:translateX(3px)}
  button.attr:disabled{cursor:default}
  .attr.pick{border-color:var(--gold);background:rgba(255,210,74,.2)}
  .card::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;mix-blend-mode:overlay;opacity:.0;transition:opacity .2s;
        background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.9),transparent 55%)}
  .card:hover::after{opacity:.35}
  .ctl{display:flex;flex-direction:column;gap:10px;min-width:220px;max-width:330px;flex:1}
  .turnmsg{font-size:1.15rem;font-weight:800}
  .timer{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
  .timer i{display:block;height:100%;width:100%;background:var(--grad);transition:width .25s linear}
  .timer.low i{background:var(--bad)}
  .power{padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-weight:800;text-align:left}
  .power.on{border-color:var(--gold);background:rgba(255,210,74,.2);box-shadow:0 0 18px rgba(255,210,74,.5);animation:winGlow 1s infinite alternate}
  .power small{display:block;font-weight:400;color:var(--muted)}
  .react{display:flex;gap:6px;flex-wrap:wrap}
  .react button{font-size:1.4rem;padding:4px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
  .react button:hover{transform:scale(1.2)}
  .log{max-height:110px;overflow:auto;font-size:.85rem;color:var(--muted);padding-left:18px;margin:0}
  .floaty{position:fixed;font-size:2.4rem;pointer-events:none;z-index:60;animation:rise 2.4s ease-out forwards;text-align:center}
  .floaty small{display:block;font-size:.7rem;color:#fff;text-shadow:0 1px 3px #000}
  @keyframes rise{to{transform:translateY(-55vh) scale(1.6);opacity:0}}
  #toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-300%);padding:11px 22px;border-radius:999px;background:var(--grad);color:#04142d;font-weight:800;
         box-shadow:0 8px 30px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:80;max-width:92vw;text-align:center}
  #toast.show{transform:translate(-50%,0)}
  .overlay{position:fixed;inset:0;background:rgba(2,8,24,.82);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
  .overlay[hidden]{display:none}
  .modal{background:linear-gradient(160deg,#0d2a66,#071a45);border:1px solid var(--accent);border-radius:22px;padding:24px 26px;max-width:460px;width:100%;text-align:center;animation:pop .5s;max-height:92vh;overflow:auto}
  .modal h2{margin:4px 0 8px;font-size:1.8rem}
  .podium{display:grid;gap:8px;margin:14px 0;text-align:left}
  .podium div{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel)}
  .podium div:first-child{border:1px solid var(--gold);background:rgba(255,210,74,.15)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:75}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bgfx" id="bgfx"></div>
<div class="topbar"><button class="btn sm" id="muteBtn" aria-label="Toggle sound">🔊 Sound on</button><button class="btn sm" id="rulesBtn">📖 Rules</button><button class="btn sm" id="leaveBtn" hidden>🚪 Leave</button></div>

<!-- HOME -->
<section class="screen" id="home">
  <h1>🃏 Card Clash</h1>
  <p class="sub">Top-trumps for 2–4 players. Pick your best stat, beat their card, take the pile — be the last with cards!</p>
  <div class="grid2">
    <div class="card-panel">
      <label class="small muted" for="nameIn">Your name</label>
      <input type="text" id="nameIn" maxlength="14" placeholder="Enter your name">
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="createBtn">🏠 Create room</button>
        <button class="btn" id="soloBtn">🤖 Play vs bots</button>
      </div>
      <p class="small muted" id="homeNote" style="margin:12px 0 0"></p>
    </div>
    <div class="card-panel">
      <label class="small muted" for="codeIn">Have a room code?</label>
      <input type="text" id="codeIn" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:1.3rem">
      <div class="row" style="margin-top:14px"><button class="btn primary" id="joinBtn">🚪 Join room</button></div>
      <p class="small muted" id="record" style="margin:12px 0 0"></p>
    </div>
  </div>
</section>

<!-- LOBBY -->
<section class="screen" id="lobby" hidden>
  <h1>🛋️ Lobby</h1>
  <div class="card-panel" style="margin-bottom:14px" id="codeBox">
    <div class="small muted">Room code — share it with friends (max 4 players)</div>
    <div class="code" id="roomCode">-----</div>
    <div class="row"><button class="btn sm" id="copyBtn">📋 Copy invite link</button><span class="small muted" id="copyNote"></span></div>
  </div>
  <div class="card-panel" style="margin-bottom:14px"><div class="small muted" style="margin-bottom:8px">Choose a deck <span id="deckHostNote"></span></div><div class="decks" id="decks"></div></div>
  <div class="card-panel"><div class="small muted" style="margin-bottom:8px">Players (<span id="pcount">1</span>/4)</div><div class="seats" id="seats"></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="startBtn">▶ Start game</button><span class="small muted" id="startNote"></span></div></div>
</section>

<!-- GAME -->
<section class="screen" id="game" hidden>
  <div class="seatsbar" id="seatsbar"></div>
  <div class="arena" id="arena"><div class="banner" id="banner"></div><div class="plays" id="plays"></div></div>
  <div class="mine">
    <div id="myCardBox"></div>
    <div class="ctl">
      <div class="turnmsg" id="turnMsg"></div>
      <div class="timer" id="timer"><i></i></div>
      <button class="power" id="powerBtn" type="button">⚡ Power Play<small>Double the stakes — every loser pays +1 card. If you lose, you pay 2 extra. Once per game.</small></button>
      <div class="react" id="react"></div>
      <ul class="log" id="log"></ul>
    </div>
  </div>
</section>

<div id="toast" role="status"></div>
<canvas id="confetti"></canvas>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="cardclash-data.js"></script>
<script src="cardclash-engine.js"></script>
<script>
(function () {
  'use strict';
  var D = window.CardClashData, E = window.CardClashEngine;
  var REVEAL_MS = 4200, TURN_MS = 25000;
  var $ = function (id) { return document.getElementById(id); };
  var BOT_NAMES = ['Bot Bolt', 'Bot Pixel', 'Bot Turbo', 'Bot Nova'];
  var REACTIONS = ['😂', '🔥', '👏', '😱', '😎', '🤯'];
  var KEY = 'rovatics.cardclash.v1';
  var save = { name: '', wins: 0, games: 0 };
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  // ================= util =================
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cleanName(n) { return String(n || '').replace(/[^\w \-]/g, '').trim().slice(0, 14); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  var toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2300); }
  function show(id) { ['home', 'lobby', 'game'].forEach(function (s) { $(s).hidden = s !== id; }); $('leaveBtn').hidden = id === 'home'; }
  function hue(str) { var h = 0; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360; return h; }
  function avatar(name, id) { var a = el('div', 'av', (name || '?').charAt(0).toUpperCase()); a.style.background = 'hsl(' + hue(id) + ' 80% 62%)'; return a; }
  function randCode() { var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = ''; for (var i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

  // floating background emoji
  (function () { var b = $('bgfx'); var em = ['🃏', '⭐', '🏆', '⚡', '🎯']; for (var i = 0; i < 14; i++) { var s = el('span', '', em[i % em.length]); s.style.left = (i * 7.3) % 100 + '%'; s.style.animationDuration = (14 + (i * 3) % 14) + 's'; s.style.animationDelay = -(i * 2) + 's'; b.appendChild(s); } })();

  // ================= sound =================
  var muted = false, ac = null;
  try { muted = localStorage.getItem(KEY + '.mute') === '1'; } catch (e) {}
  function refreshMute() { $('muteBtn').textContent = muted ? '🔇 Sound off' : '🔊 Sound on'; }
  $('muteBtn').onclick = function () { muted = !muted; try { localStorage.setItem(KEY + '.mute', muted ? '1' : '0'); } catch (e) {} refreshMute(); };
  refreshMute();
  function tone(f, d, type, when, vol) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (when || 0);
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  var SFX = {
    flip: function () { tone(520, .08, 'triangle'); tone(780, .07, 'triangle', .05); },
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, .2, 'square', i * .09, .09); }); },
    lose: function () { tone(300, .25, 'sawtooth', 0, .08); tone(200, .35, 'sawtooth', .15, .08); },
    tie: function () { tone(440, .15, 'sine'); tone(440, .15, 'sine', .2); },
    power: function () { [200, 400, 800, 1200].forEach(function (f, i) { tone(f, .12, 'sawtooth', i * .06, .08); }); },
    tick: function () { tone(900, .05, 'square', 0, .05); },
    fanfare: function () { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tone(f, .25, 'triangle', i * .13, .13); }); },
    pop: function () { tone(660, .08, 'sine'); }
  };
  document.addEventListener('pointerdown', function () { if (ac && ac.state === 'suspended') ac.resume(); }, { once: true });

  // ================= card rendering =================
  function power(card, deck) { var s = 0, n = 0; deck.attrs.forEach(function (a) { s += card.stats[a.key] / deck.max[a.key]; n++; }); return s / n; }
  function tier(card, deck) { var p = power(card, deck); return p >= .8 ? 'legendary' : p >= .62 ? 'epic' : p >= .45 ? 'rare' : 'common'; }
  function bestAttr(card, deck) { var b = null, bv = -1; deck.attrs.forEach(function (a) { var v = card.stats[a.key] / deck.max[a.key]; if (v > bv) { bv = v; b = a.key; } }); return b; }
  function fmt(v) { return v >= 1000 ? v.toLocaleString('en-US') : String(v); }

  // opts: {clickable, onPick, hl}
  function renderCard(card, deck, opts) {
    opts = opts || {};
    var t = tier(card, deck), c = el('div', 'card tilt ' + t);
    c.style.setProperty('--h', card.hue);
    var inner = el('div', 'inner'), art = el('div', 'art');
    art.appendChild(el('div', 'big', card.emoji)); art.appendChild(el('div', 'tier', t));
    var nr = el('div', 'nmrow'); nr.appendChild(el('b', '', card.name)); nr.appendChild(el('span', '', deck.emoji + ' ' + card.sub));
    var at = el('div', 'attrs'), best = bestAttr(card, deck);
    deck.attrs.forEach(function (a, i) {
      var b = el(opts.clickable ? 'button' : 'div', 'attr' + (a.key === best ? ' best' : '') + (opts.hl === a.key ? ' pick' : ''));

    save.games++; if (iWon) save.wins++; persist(); updateRecord();
    var ranked = v.players.slice().sort(function (a, b) { return (b.id === v.winnerId) - (a.id === v.winnerId) || b.count - a.count; });
    var html = '<div style="font-size:3rem">' + (iWon ? '🏆' : '🎖️') + '</div><h2>' + (iWon ? 'You are the Champion!' : esc(winner ? winner.name : '?') + ' wins!') + '</h2>' +
      '<p class="muted">' + (iWon ? 'You collected every card. Legendary!' : 'Better luck next round — rematch?') + '</p><div class="podium">';
    ranked.forEach(function (p, i) { html += '<div><span>' + ['🥇', '🥈', '🥉', '4️⃣'][i] + '</span><b>' + esc(p.name) + (p.id === v.you ? ' (you)' : '') + '</b><span style="margin-left:auto" class="muted">' + p.count + ' cards</span></div>'; });
    html += '</div><div class="row" style="justify-content:center">' + (isHost ? '<button class="btn primary" id="again">🔁 Play again</button>' : '<span class="muted small">Waiting for host to start a rematch…</span>') +
      '<button class="btn" id="quit">Leave</button></div>';
    $('modal').innerHTML = html; $('overlay').hidden = false;
    if (iWon) { confetti(); SFX.fanfare(); } else SFX.lose();
    var a = $('again'); if (a) a.onclick = hostBackToLobby;
    $('quit').onclick = leave;
  }
  function hideOverlay() { $('overlay').hidden = true; }
  function updateRecord() { $('record').textContent = save.games ? '🏅 Your record: ' + save.wins + ' wins from ' + save.games + ' games' : ''; }

  // ---------- confetti ----------
  var cv = $('confetti'), cx = cv.getContext('2d'), parts = [], raf = 0;
  function confetti() {
    cv.width = innerWidth; cv.height = innerHeight; parts = [];
    var cols = ['#42e8f5', '#0878f9', '#ffd24a', '#5dffa0', '#ff5d73', '#fff'];
    for (var i = 0; i < 200; i++) parts.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6, vx: (Math.random() - .5) * 5, vy: 2 + Math.random() * 5, s: 5 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0] });
    cancelAnimationFrame(raf);
    (function frame() {
      cx.clearRect(0, 0, cv.width, cv.height);
      parts.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
      parts = parts.filter(function (p) { return p.y < cv.height + 20; });
      if (parts.length) raf = requestAnimationFrame(frame); else cx.clearRect(0, 0, cv.width, cv.height);
    })();
  }

  // ================= navigation =================
  function resetToHome() {
    try { if (peer) peer.destroy(); } catch (e) {}
    if (H) { clearTimeout(H.turnT); clearTimeout(H.botT); }
    peer = null; hostConn = null; H = null; isHost = false; lobby = null; view = null; busy = false; queued = null; endShown = false;
    clearInterval(timerT); hideOverlay(); show('home'); $('homeNote').textContent = '';
  }
  function leave() { try { if (!isHost && hostConn && hostConn.open) hostConn.send({ t: 'leave' }); } catch (e) {} resetToHome(); }
  $('leaveBtn').onclick = leave;
  window.addEventListener('beforeunload', function () { try { if (hostConn && hostConn.open) hostConn.send({ t: 'leave' }); } catch (e) {} });

  function needName() { var n = cleanName($('nameIn').value); if (!n) { toast('Please enter your name first 🙂'); $('nameIn').focus(); return null; } me.name = n; save.name = n; persist(); return n; }
  $('createBtn').onclick = function () { if (needName()) startHost(true); };
  $('soloBtn').onclick = function () { if (needName()) startHost(false); };
  $('joinBtn').onclick = function () {
    if (!needName()) return; var code = $('codeIn').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{5}$/.test(code)) return toast('Room codes have 5 characters');
    joinRoom(code);
  };
  $('startBtn').onclick = function () { if (isHost) hostStart(); };
  $('copyBtn').onclick = function () {
    var link = location.href.split('?')[0].split('#')[0] + '?room=' + (lobby && lobby.code), done = function () { $('copyNote').textContent = 'Copied!'; toast('Invite link copied 📨'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { $('copyNote').textContent = link; }); else $('copyNote').textContent = link;
  };
  $('rulesBtn').onclick = function () {
    $('modal').innerHTML = '<h2>📖 How to play</h2><div style="text-align:left" class="muted"><p>• The whole deck is dealt to 2–4 players. You only ever see your <b>top card</b>.</p>' +
      '<p>• The <b>teller 👑</b> picks one stat on their card. Everyone reveals their top card.</p><p>• The <b>highest value wins every revealed card</b> and becomes the next teller.</p>' +
      '<p>• <b>Tie?</b> The cards go in a pot and the same teller goes again — the next winner takes the pot.</p>' +
      '<p>• <b>⚡ Power Play</b> (once per game): double the stakes! Every loser pays one extra card. If you lose your own Power Play, you pay two extra.</p>' +
      '<p>• Run out of cards and you are out. Last player holding cards wins!</p><p>• Shortcut: press the <b>number keys</b> (1, 2, 3…) to pick a stat. You have 25 seconds per turn.</p>' +
      '<p class="small">Cricket numbers are approximate career totals; wrestling values are fan-made ratings — for fun only.</p></div><button class="btn primary" id="rOk">Got it</button>';
    $('overlay').hidden = false; $('rOk').onclick = hideOverlay;
  };

  // boot
  $('nameIn').value = save.name || ''; updateRecord(); applyTheme(D.DECKS.cricket);
  var rm = /[?&]room=([A-Za-z0-9]{5})/.exec(location.search);
  if (rm) { $('codeIn').value = rm[1].toUpperCase(); $('homeNote').textContent = 'Invite detected — enter your name and tap Join room.'; }

  window.__cc = { get host() { return H; }, get view() { return view; }, get busy() { return busy; }, pick: pick, hostStart: hostStart, forceTeller: function (id) { H.G.tellerId = id; pushViews(); scheduleTurn(false); }, REVEAL_MS: REVEAL_MS };
})();
</script>
</body>
