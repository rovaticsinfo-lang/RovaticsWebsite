<!doctype html><meta charset="utf-8"><body><pre id="out">RUNNING</pre>
<iframe id="f" src="../games/sudoku.html" style="width:900px;height:900px"></iframe>
<script>
const out=[];const ok=(c,m)=>out.push((c?'PASS ':'FAIL ')+m);
document.getElementById('f').onload=()=>{try{
 const w=f.contentWindow,d=w.document,S=w.__sudoku,E=w.SudokuEngine;
 let g=S.game; ok(g.level===1,'starts level 1');
 ok(d.querySelectorAll('#board .cell').length===81,'81 cells');
 // no validation before submit: enter a wrong duplicate digit
 const empty=g.grid.findIndex(v=>!v); const wrong=g.solution[empty]%9+1;
 S.select(empty);S.enter(wrong);
 ok(!d.querySelector('.cell.err'),'no error shown before submit');
 d.getElementById('submitBtn').click();
 ok(/Not quite/.test(d.getElementById('msg').textContent),'submit reports problems');
 // clues: max 5
 for(let i=0;i<8;i++)d.getElementById('clueBtn').click();
 ok(g.clues===5 && d.getElementById('clueLeft').textContent==='0','clues capped at 5');
 ok(d.getElementById('clueBtn').disabled,'clue button disabled');
 // solve fully and submit
 g.solution.forEach((v,i)=>{ if(!g.given[i]&&!g.hinted[i]){S.select(i);S.enter(v);} });
 ok(/encourag|!/.test(d.getElementById('toast').textContent),'toast shown: '+d.getElementById('toast').textContent);
 d.getElementById('submitBtn').click();
 ok(!d.getElementById('overlay').hidden && /Level 1 Complete/.test(d.getElementById('modal').textContent),'celebration modal');
 ok(!!d.getElementById('mNext'),'next level button');
 d.getElementById('mNext').click();
 ok(S.game.level===2 && S.game.clues===0,'level 2 started, clues reset');
 ok(d.querySelectorAll('.lv:not(:disabled)').length===2,'only 2 levels unlocked');
 ok(d.querySelector('#board-lb').textContent.length>0,'leaderboard renders');
 // ---- power features (level 2 now running)
 {
  const g2=S.game; const e2=g2.grid.findIndex((v,i)=>!v&&!g2.given[i]);
  S.select(e2); S.setNoteMode(true); S.enter(3); S.enter(5);
  ok((g2.notes[e2]||[]).length===2 && !!d.querySelector('.cell .nt'),'pencil notes recorded and drawn');
  S.setNoteMode(false); S.enter(g2.solution[e2]);
  ok(g2.grid[e2]===g2.solution[e2] && !g2.notes[e2],'placing a digit clears its notes');
  S.undo(); ok(g2.grid[e2]===0 && (g2.notes[e2]||[]).length===2,'undo restores empty cell with notes');
  S.undo(); S.undo(); ok((g2.notes[e2]||[]).length===0,'undo walks back note history');
  d.getElementById('pauseBtn').click();
  ok(g2.paused && !d.getElementById('overlay').hidden && d.getElementById('board').style.visibility==='hidden','pause hides board + shows overlay');
  ok(w.__androidBack()===true && !g2.paused && d.getElementById('overlay').hidden,'Back resumes from pause');
  ok(w.__androidBack()===true && g2.paused,'Back during play pauses');
  d.getElementById('mResume').click();
  const mb=d.getElementById('muteBtn'); mb.click(); ok(mb.textContent==='🔇' && JSON.parse(w.localStorage.getItem('rovatics.sudoku.v1')).muted===true,'mute persists');
  mb.click(); ok(mb.textContent==='🔊','unmute');
  ok(JSON.parse(w.localStorage.getItem('rovatics.sudoku.v1')).stars[1]>=1 && /★/.test(d.querySelector('.lv').textContent),'level stars persisted and shown');
  let ev=0; d.addEventListener('rv-haptic',()=>ev++); S.select(e2); S.enter(1); ok(ev>0,'haptic event fired');
 }
}catch(e){ok(false,'exception '+e.message)}
 document.getElementById('out').textContent=out.join('\n')+'\nDONE';};
</script>
