<!doctype html><meta charset="utf-8"><body><pre id="out">RUNNING</pre>
<!-- Crowd Rush needs WebGL 2 and ES modules, so serve the repo over http and use a GPU-less Chrome:
       node -e "require('http').createServer((q,r)=>require('fs').createReadStream('.'+q.url.split('?')[0]).on('error',()=>{r.statusCode=404;r.end()}).pipe(r)).listen(8080)"
       chrome --headless=new --use-angle=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=90000 --dump-dom http://localhost:8080/tests/crowdrush-ui-test.html
     (file:// does not work: module scripts and the model are fetched over http.) -->
<iframe id="f" src="../games/crowd-rush.html?q=0" style="width:430px;height:860px"></iframe>
<script>
const out=[];const ok=(c,m)=>out.push((c?'PASS ':'FAIL ')+m);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let loads=0;
document.getElementById('f').onload=async()=>{try{
 if(loads++>0) return;
 const w=f.contentWindow,d=w.document;
 for(let i=0;i<300&&!(w.__cr&&w.__cr.G.state==='home');i++) await wait(250);
 const C=w.__cr; const G=C.G;
 ok(!!C&&G.state==='home','boots to the home screen');
 ok(d.querySelector('.rv-brand-badge img')&&/rovatics-logo/.test(d.querySelector('.rv-brand-badge img').getAttribute('src')),'Rovatics badge present');
 ok(/viewport-fit=cover/.test(d.querySelector('meta[name=viewport]').content),'viewport-fit=cover present');
 ok(typeof w.__androidBack==='function'&&w.__androidBack()===false,'Back on home is left to the app');

 // ---- a different real-world theme after every level ----
 const names=[]; for(let L=1;L<=9;L++){ C.loadLevel(L); names.push(C.world.theme.id); }
 ok(new Set(names.slice(0,8)).size===8&&names[8]===names[0],'8 distinct themes in rotation: '+names.slice(0,8).join(', '));
 ok(['city','forest','beach','highway','rail','airport'].every(t=>names.includes(t)),'includes road, forest, beach, highway, train track and airport');

 // ---- jump ----
 C.loadLevel(1); C.startRun(); const P=G.player; G.lvl.gates.forEach(g=>g.done=true); G.lvl.enemies.forEach(e=>e.done=true);
 await wait(200); C.jumpNow(); await wait(600);
 ok(P.jy>0.5,'jump lifts the crowd (height '+P.jy.toFixed(2)+' m)');
 ok(P.persons.some(p=>p.y>0.5),'people leave the ground');
 for(let i=0;i<400&&G.jump.t>=0;i++) await wait(100); ok(G.jump.t<0&&P.jy===0,'the crowd lands again');

 // ---- throttle ----
 G.pad.up=true; for(let i=0;i<120&&G.speedMul<2.19;i++) await wait(100); G.pad.up=false;
 ok(G.speedMul>=2.19,'accelerating raises speed to the maximum ('+G.speedMul.toFixed(1)+'x)');
 G.pad.dn=true; for(let i=0;i<120&&G.speedMul>0.41;i++) await wait(100); G.pad.dn=false;
 ok(G.speedMul<=0.41,'braking lowers speed to the minimum ('+G.speedMul.toFixed(1)+'x)');
 const m1=G.speedMul; await wait(500); ok(G.speedMul===m1,'the chosen speed stays where it is left');

 // ---- no guard rails: steering off the edge loses people ----
 C.loadLevel(1); C.startRun(); const P2=G.player; G.lvl.gates.forEach(g=>g.done=true); G.lvl.enemies.forEach(e=>e.done=true);
 P2.setCount(30); G.targetX=5.4;
 for(let i=0;i<200&&G.fallen<5;i++) await wait(100);
 ok(G.fallen>=5&&P2.count<30,'people who step off the road fall and are lost ('+G.fallen+' fell, '+P2.count+' left of 30)');

 // ---- aerial pickups only reachable by jumping ----
 C.loadLevel(1); const L=G.lvl;
 ok(L.coins.some(c=>c.y>2)&&L.boxes.length>0,'level has coins and mystery boxes in the air');
 C.startRun(); const P3=G.player; L.gates.forEach(g=>g.done=true); L.enemies.forEach(e=>e.done=true); P3.setCount(10);
 const bx=L.boxes[0]; P3.z=bx.z+22; P3.x=bx.x; G.targetX=bx.x;
 let jumped=false; for(let i=0;i<400&&P3.z>bx.z-6;i++){ if(!jumped&&P3.z-bx.z<6.5){jumped=true;C.jumpNow();} G.targetX=bx.x; await wait(50); }
 ok(bx.taken,'jumping collects the mystery box');
 C.loadLevel(1); C.startRun(); const L2=G.lvl,P4=G.player; L2.gates.forEach(g=>g.done=true); L2.enemies.forEach(e=>e.done=true); P4.setCount(10);
 const bx2=L2.boxes[0]; P4.z=bx2.z+22; P4.x=bx2.x; G.targetX=bx2.x;
 for(let i=0;i<400&&P4.z>bx2.z-6;i++){ G.targetX=bx2.x; await wait(50); }
 ok(!bx2.taken,'running underneath without jumping misses it');

 // ---- blades: a jump clears them ----
 const run=async(doJump)=>{ C.loadLevel(3); C.startRun(); const Q=G.player,Lv=G.lvl; Lv.gates.forEach(g=>g.done=true); Lv.enemies.forEach(e=>e.done=true); Q.setCount(40);
   Lv.hazards.forEach(x=>{ if(x.type==='saw'){ x.amp=0; x.cd=0; } }); const h=Lv.hazards.find(x=>x.type==='saw'); Q.z=h.z+26; let j=false;
   for(let i=0;i<1500&&Q.z>h.z-8;i++){ if(doJump&&!j&&Q.z-h.z<6.2){j=true;C.jumpNow();} await wait(25); } return Q.count; };
 const noJ=await run(false), withJ=await run(true);
 ok(withJ>noJ,'jumping over the blades keeps more people ('+withJ+' vs '+noJ+' of 40 without)');

 // ---- boss win flow still works ----
 C.loadLevel(1); C.startRun(); const P5=G.player; P5.setCount(120); P5.z=G.boss.z+60; G.lvl.gates.forEach(g=>g.done=true); G.lvl.enemies.forEach(e=>e.done=true);
 for(let i=0;i<1600&&G.state!=='result';i++) await wait(250);
 ok(G.state==='result'&&G.win===true,'a big crowd beats the boss (state '+G.state+', win '+G.win+', left '+G.player.count+', boss hp '+G.boss.hp+')');
}catch(e){ok(false,'exception: '+e.message)}
 document.getElementById('out').textContent=out.join('\n')+'\n'+(out.some(l=>l.startsWith('FAIL'))?'SOME FAILED':'ALL PASSED');
};
</script>
